---
# Default ktranslate image. Pin this to an explicit version or digest in production.
anro_ktranslate_image: "kentik/ktranslate:latest"

# Docker is intentionally installed outside this role. Override only when the
# Docker CLI is installed at a non-standard absolute path.
anro_ktranslate_docker_binary: "/usr/bin/docker"

# Host paths used for role-managed systemd units and configuration artifacts.
anro_ktranslate_systemd_dir: "/etc/systemd/system"
anro_ktranslate_config_dir: "/etc/ktranslate"
anro_ktranslate_environment_dir: "/etc/ktranslate/environment"

# Prefix used to limit reconciliation to role-owned ktranslate unit names.
# Instance names must begin with '<prefix>-'.
anro_ktranslate_service_prefix: "ktranslate"

# Container defaults. Individual instances may override each value.
anro_ktranslate_default_network: "bridge"
anro_ktranslate_default_pull_policy: "missing"
anro_ktranslate_default_restart_sec: 5
anro_ktranslate_default_stop_timeout: 30
anro_ktranslate_default_start_limit_interval_sec: 60
anro_ktranslate_default_start_limit_burst: 5

# Prometheus is the deployment default, not a hard-coded role behavior. An
# instance can replace this command completely to use any ktranslate-supported
# format, sink, input mode, or CLI option.
anro_ktranslate_default_command:
  - "-format=prometheus"
  - "-sinks=prometheus"
  - "-prom_listen=:8082"

# Remove role-managed units, containers, configuration directories, and
# environment files when their instance names disappear from inventory.
anro_ktranslate_reconcile: true

anro_ktranslate_default_volumes:
  - source: /etc/ktranslate
    target: /etc/ktranslate
    read_only: false
# Single desired-state interface for every ktranslate container. The 'type'
# field is descriptive metadata only; it does not select special role logic.
anro_ktranslate_instances: []
anro_ktranslate_snmp_config: {}
