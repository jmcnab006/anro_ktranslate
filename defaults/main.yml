---
# Default ktranslate image. Pin this to an explicit version or digest in production.
anro_ktranslate_image: "kentik/ktranslate:latest"

anro_ktranslate_debug: false
# Docker is intentionally installed outside this role. Override only when the
# Docker CLI is installed at a non-standard absolute path.
anro_ktranslate_docker_binary: "/usr/bin/docker"

# Host paths used for role-managed systemd units and configuration artifacts.
anro_ktranslate_systemd_dir: "/etc/systemd/system"
anro_ktranslate_config_dir: "/etc/ktranslate"
anro_ktranslate_environment_dir: "/etc/ktranslate/environment"

# Prefix used to limit reconciliation to role-owned ktranslate unit names.
# Instance names must begin with '<prefix>-'.
anro_ktranslate_service_prefix: "ktranslate"

# Container defaults. Individual instances may override each value.
anro_ktranslate_default_network: "bridge"
anro_ktranslate_default_pull_policy: "missing"
anro_ktranslate_default_restart_sec: 5
anro_ktranslate_default_stop_timeout: 30
anro_ktranslate_default_start_limit_interval_sec: 60
anro_ktranslate_default_start_limit_burst: 5

# Generic command arguments are retained as an escape hatch for instances that
# intentionally do not use a type profile or need a raw upstream command. Typed
# instances normally use ktranslate_args instead because keyed arguments can be
# overridden without copying the complete command list.
anro_ktranslate_default_command:
  - "-format=prometheus"
  - "-sinks=prometheus"
  - "-prom_listen=:8082"


# Every container receives a role-owned SNMP configuration. Optional remote and
# instance-local configuration layers are recursively merged over this baseline
# with list replacement. Precedence is: instance config > URL > baseline.
anro_ktranslate_baseline_config:
  global:
    poll_time_sec: 60
    timeout_ms: 3000
    retries: 1
    drop_if_outside_poll: false
    mib_profile_dir: /etc/ktranslate/profiles
    mibs_db: /etc/ktranslate/mibs.db
    mibs_enabled:
      - HOST-RESOURCES-MIB
  devices: {}

# Optional stack-wide instance overrides. Mappings are recursively merged;
# scalar values and lists supplied by an instance replace the inherited value.
anro_ktranslate_instance_defaults: {}

# Built-in profiles are independent and keyed by instance type. A non-empty type
# selects the same-named profile; omitted/null/empty type values intentionally
# bypass profiles so custom instances can use global and instance configuration.
#
# ktranslate_args is a mapping because CLI options have names and therefore can
# be merged safely. Instance keys override type-profile keys and a null instance value
# removes an inherited argument entirely. The role renders the final mapping to
# the upstream -key=value command-line representation.
anro_ktranslate_profiles:
  polling:
    ktranslate_args:
      snmp: /etc/ktranslate/snmp.yaml
      format: prometheus
      sinks: prometheus
      prom_listen: ":8082"

  discovery:
    ktranslate_args:
      snmp: /etc/ktranslate/snmp.yaml
      snmp_discovery_on_start: true
      snmp_out_file: /etc/ktranslate/runtime/discovery.yaml
    # Discovery writes runtime inventory rather than exporting metrics. Only the
    # runtime directory is bind-mounted writable so managed configuration stays read-only.
    discovery_output: true

  traps:
    ktranslate_args:
      snmp: /etc/ktranslate/snmp.yaml
      format: flat_json
      sinks: file
      file_out: /etc/ktranslate/runtime
      file_on: true
      file_flush_sec: 1
    # Trap events are written to the file sink in an isolated writable runtime
    # directory. Production deployments can override the sink arguments without
    # changing the trap listener profile.
    runtime_output: true

# Remove role-managed units, containers, configuration directories, and
# environment files when their instance names disappear from inventory.
anro_ktranslate_reconcile: true

anro_ktranslate_default_volumes:
  - source: /etc/ktranslate
    target: /etc/ktranslate
    read_only: false
# Single desired-state interface for every ktranslate container. 'type' is
# optional; when non-empty it selects the same-named profile definition.
anro_ktranslate_instances: []
anro_ktranslate_snmp_config: {}

anro_ktranslate_validate_certs: true
