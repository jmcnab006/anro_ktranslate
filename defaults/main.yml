---
# anro_ktranslate role defaults

anro_ktranslate_enabled: true

# Pin releases deliberately. Current upstream release observed during role creation.
anro_ktranslate_version: "2.2.37"

# Installation modes:
#   package_url - download and install an upstream/internal .deb package
#   preinstalled - configure an existing /usr/bin/ktranslate binary
anro_ktranslate_install_method: "package_url"

# Enterprise recommendation: mirror the desired .deb to an internal artifact repo.
# Example:
# anro_ktranslate_package_url: "https://repo.example.net/ktranslate_2.2.37_amd64.deb"
anro_ktranslate_package_url: ""
anro_ktranslate_package_checksum: ""

anro_ktranslate_user: "ktranslate"
anro_ktranslate_group: "ktranslate"

anro_ktranslate_config_dir: "/etc/ktranslate"
anro_ktranslate_snmp_config_path: "/etc/ktranslate/snmp.yaml"
anro_ktranslate_environment_path: "/etc/default/ktranslate"
anro_ktranslate_binary_path: "/usr/bin/ktranslate"

# Prometheus output endpoint.
anro_ktranslate_prometheus_listen: "0.0.0.0:8082"
anro_ktranslate_prometheus_sink_enabled: true

anro_ktranslate_log_level: "info"
anro_ktranslate_service_name: "ktranslate-snmp"

# ktranslate command-line arguments. The role appends the SNMP config,
# Prometheus sink and listen address automatically.
anro_ktranslate_extra_flags: []

# The role renders this dictionary directly to snmp.yaml.
# This base follows the upstream sample configuration structure.
anro_ktranslate_snmp_config:
  devices: {}
  trap:
    listen: "127.0.0.1:1620"
    community: "change-me"
    version: ""
    transport: ""
  discovery:
    cidrs: []
    ignore_list: []
    debug: false
    ports:
      - 161
    default_communities: []
    default_v3: null
    add_devices: true
    add_mibs: true
    threads: 4
    replace_devices: true
    check_all_ips: false
    use_snmp_v1: false
  global:
    poll_time_sec: 60
    drop_if_outside_poll: false
    mib_profile_dir: "/etc/ktranslate/profiles"
    mibs_db: "/etc/ktranslate/mibs.db"
    mibs_enabled:
      - "IF-MIB"
    timeout_ms: 3000
    retries: 0
    global_v3: null
    response_time: true
    ping_interval_sec: 60
    jitter_time_sec: 0
    fast_poll: false
    watch_profile_changes: false

# Optional package/config directories that may already be provided by the
# upstream package. The role creates them but does not invent MIB profiles.
anro_ktranslate_profiles_dir: "/etc/ktranslate/profiles"
anro_ktranslate_mibs_db_dir: "/etc/ktranslate/mibs.db"

# Whether ktranslate may use ICMP response-time collection.
# CAP_NET_RAW is required when enabled.
anro_ktranslate_enable_net_raw: true

# Network validation performed after service startup.
anro_ktranslate_validate_endpoint: true
anro_ktranslate_validate_host: "127.0.0.1"
anro_ktranslate_validate_port: 8082
anro_ktranslate_validate_path: "/metrics"
anro_ktranslate_validate_retries: 15
anro_ktranslate_validate_delay: 2

# Firewall management is intentionally left to the calling role/playbook.
anro_ktranslate_manage_firewall: false
