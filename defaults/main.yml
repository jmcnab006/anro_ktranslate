---
# =============================================================================
# anro_ktranslate role defaults
# =============================================================================
#
# This role manages one or more ktranslate Docker containers as independent
# systemd services.
#
# Instances are separated into three functional groups:
#
#   * polling
#   * discovery
#   * traps
#
# Each entry in one of the instance lists results in an independently managed
# Docker container and systemd service. This allows a host to run multiple
# instances of each service type and makes the deployment horizontally
# scalable through inventory configuration.
#
# Role defaults should remain safe and generic. Site-specific configuration,
# credentials, device assignments, and topology should be supplied through
# inventory, group_vars, host_vars, or the deployment pipeline.


# =============================================================================
# Docker image
# =============================================================================

# Default ktranslate Docker image used by all instances.
#
# Individual instances may override this value using their `image` property.
#
# For production deployments, override this value with a tested version tag
# or, preferably, an immutable image digest. Using `latest` makes deployments
# dependent on the registry state and can cause different containers to run
# different software after subsequent deployments.
#
# Example production override:
#
# anro_ktranslate_image: "kentik/ktranslate:v2.1.0"
#
# Or with an immutable digest:
#
# anro_ktranslate_image: >-
#   kentik/ktranslate@sha256:0123456789abcdef...
#
anro_ktranslate_image: "kentik/ktranslate:latest"


# =============================================================================
# Docker runtime
# =============================================================================

# Absolute path to the Docker CLI.
#
# The systemd units generated by this role execute Docker directly rather than
# relying on the interactive PATH of the Ansible user. Using an absolute path
# makes systemd execution deterministic.
#
# This role assumes Docker is already installed and operational. Installation
# and configuration of the Docker Engine should remain the responsibility of
# the Docker role.
anro_ktranslate_docker_binary: "/usr/bin/docker"


# Default Docker network assigned to ktranslate containers.
#
# Supported common values include:
#
#   bridge
#     Uses Docker's default bridge network. Services that need to be reachable
#     from outside the container must be explicitly published using `ports`.
#
#   host
#     Shares the host network namespace directly. ktranslate listeners bind
#     directly to host interfaces and no Docker port publishing is performed.
#
# Individual instances may override this value using their `network` property.
#
# Host networking is useful for SNMP polling, discovery, trap receivers, and
# other network-oriented workloads where direct access to the host network is
# desirable.
#
# IMPORTANT:
# Instances using `network: "host"` must not define `ports`. Docker port
# publishing is not applicable when the container shares the host network
# namespace.
anro_ktranslate_default_network: "bridge"


# Default image pull behavior.
#
# Supported values:
#
#   always
#     Pull the image whenever the instance is deployed.
#
#   missing
#     Pull the image only when it does not already exist locally.
#
#   never
#     Never pull the image. The requested image must already exist locally.
#
# `missing` avoids unnecessary registry operations while still allowing a new
# host to obtain the required image.
#
# Production deployments using immutable image digests can safely use either
# `always` or `missing`, depending on the desired deployment behavior.
anro_ktranslate_default_pull_policy: "missing"


# =============================================================================
# Host filesystem
# =============================================================================

# Base directory containing files managed by this role.
#
# Generated ktranslate configuration files are stored below this directory.
#
# The directory is intended to contain configuration only. Persistent runtime
# data should use a separate location if ktranslate requires it in the future.
anro_ktranslate_config_dir: "/etc/ktranslate"


# Directory containing Docker environment files generated for instances.
#
# Environment files may contain credentials, API keys, or other sensitive
# values. The role therefore manages this directory and its files with
# restrictive permissions.
#
# Secrets should normally come from Ansible Vault, an external secret system,
# or CI/CD secret injection rather than being committed directly to inventory.
anro_ktranslate_environment_dir: "/etc/ktranslate/environment"


# Directory where generated systemd unit files are installed.
#
# `/etc/systemd/system` is appropriate for locally managed system services and
# takes precedence over vendor-provided units under `/usr/lib/systemd/system`
# or `/lib/systemd/system`.
anro_ktranslate_systemd_dir: "/etc/systemd/system"


# =============================================================================
# Container filesystem
# =============================================================================

# Location inside each container where the generated ktranslate configuration
# is mounted.
#
# This is separate from `anro_ktranslate_config_dir`, which represents the
# location on the Docker host.
#
# Keeping the host and container paths independent allows the host filesystem
# layout to change without requiring changes to ktranslate's expected
# container-side configuration path.
anro_ktranslate_container_config_dir: "/etc/ktranslate"


# =============================================================================
# systemd service behavior
# =============================================================================

# Prefix used for generated systemd unit names and Docker container names.
#
# Given:
#
#   service type: polling
#   instance name: na-east-01
#
# the resulting service/container name is expected to be:
#
#   ktranslate-polling-na-east-01
#
# Changing this value after deployment can cause existing services to appear
# obsolete. Reconciliation should therefore be enabled when intentionally
# changing the prefix.
anro_ktranslate_service_prefix: "ktranslate"


# Number of seconds systemd waits before restarting a failed ktranslate
# container.
#
# Individual instances may override this value using `restart_sec`.
#
# A short delay prevents a failing container from entering an excessively
# aggressive restart loop while still allowing transient failures to recover
# automatically.
anro_ktranslate_default_restart_sec: 5


# Number of seconds Docker is given to gracefully stop a container before
# Docker forcibly terminates it.
#
# Individual instances may override this value using `stop_timeout`.
#
# This should be long enough for ktranslate to flush or close any outstanding
# work during normal service shutdown.
anro_ktranslate_default_stop_timeout: 30


# =============================================================================
# Reconciliation
# =============================================================================

# Remove previously managed ktranslate services that are no longer present in
# the desired configuration.
#
# When enabled, the role treats the current Ansible configuration as the
# authoritative desired state.
#
# For example, if inventory previously contained:
#
#   anro_ktranslate_polling_instances:
#     - name: "polling-01"
#     - name: "polling-02"
#
# and is later changed to:
#
#   anro_ktranslate_polling_instances:
#     - name: "polling-01"
#
# the role should stop and remove the systemd unit and Docker container for
# `polling-02`.
#
# This behavior is important for the intended Git/CI/CD operating model:
#
#   Git configuration
#       -> Ansible desired state
#       -> systemd services
#       -> Docker containers
#
# Without reconciliation, removing an instance from Git could leave an orphaned
# container running indefinitely.
#
# Disable this only when obsolete instances must intentionally remain on the
# host even after they disappear from the Ansible configuration.
anro_ktranslate_reconcile: true


# =============================================================================
# Polling instances
# =============================================================================

# ktranslate instances responsible for device polling.
#
# An empty list means this host does not run polling instances.
#
# Each item creates an independent Docker container and systemd service.
#
# Supported instance properties are documented below as an example. They are
# intentionally not populated in the default list because defaults should not
# cause ktranslate containers to be created automatically.
#
# Example:
#
# anro_ktranslate_polling_instances:
#   - name: "na-east-01"
#     enabled: true
#
#     # Optional per-instance image override.
#     image: "kentik/ktranslate:v2.1.0"
#
#     # Optional Docker network override.
#     network: "ktranslate"
#
#     # Optional image pull behavior override.
#     pull_policy: "missing"
#
#     # Optional systemd restart delay override.
#     restart_sec: 5
#
#     # Optional graceful container shutdown timeout.
#     stop_timeout: 30
#
#     # ktranslate configuration rendered for this instance.
#     #
#     # The structure is intentionally open-ended because the role should not
#     # unnecessarily couple its public interface to every ktranslate
#     # configuration option.
#     config: {}
#
#     # Set to true when the rendered configuration itself may contain secrets.
#     # This prevents the configuration task from exposing those values in
#     # Ansible output.
#     config_no_log: false
#
#     # Environment variables supplied to the container.
#     #
#     # Environment files are stored with restrictive permissions because these
#     # values may include credentials.
#     environment: {}
#
#     # Docker port mappings.
#     #
#     # Examples:
#     #
#     #   - "8082:8082/tcp"
#     #   - "127.0.0.1:8082:8082/tcp"
#     #
#     # Binding Prometheus endpoints to localhost can be useful when Alloy runs
#     # on the same host and remote access to the metrics endpoint is not
#     # required.
#     ports: []
#
#     # Additional bind mounts.
#     #
#     # Example:
#     #
#     # volumes:
#     #   - source: "/var/lib/ktranslate/polling-na-east-01"
#     #     target: "/var/lib/ktranslate"
#     #     read_only: false
#     volumes: []
#
#     # Additional Linux capabilities.
#     #
#     # Capabilities should only be granted when required by the specific
#     # ktranslate workload. Avoid broad container privilege such as
#     # `--privileged`.
#     cap_add: []
#
#     # Arguments passed after the Docker image.
#     #
#     # With the standard ktranslate image these become arguments to the image
#     # entrypoint.
#     command: []
#
#     # Escape hatch for Docker CLI options not explicitly modeled by the role.
#     #
#     # Prefer dedicated role properties whenever possible because arbitrary
#     # Docker arguments are more difficult to validate and can weaken the
#     # security guarantees provided by the role.
#     extra_docker_args: []
#
anro_ktranslate_polling_instances: []


# =============================================================================
# Discovery instances
# =============================================================================

# ktranslate instances responsible for device discovery.
#
# Discovery is modeled separately from polling because discovery workloads may
# eventually require different scheduling, permissions, networking, command
# arguments, or scaling behavior.
#
# The instance schema is currently the same as polling instances.
#
# Example:
#
# anro_ktranslate_discovery_instances:
#   - name: "na-east-01"
#     enabled: true
#     network: "ktranslate"
#
#     config: {}
#
#     environment: {}
#
#     ports:
#       - "127.0.0.1:8182:8082/tcp"
#
#     command: []
#
# No discovery containers are created unless explicitly configured.
anro_ktranslate_discovery_instances: []


# =============================================================================
# Trap instances
# =============================================================================

# ktranslate instances responsible for receiving traps.
#
# Trap receivers are separated from polling and discovery because they expose
# inbound network listeners and may require additional Docker capabilities or
# host port mappings.
#
# Example using an unprivileged host port:
#
# anro_ktranslate_trap_instances:
#   - name: "na-east-01"
#     enabled: true
#     network: "ktranslate"
#
#     config: {}
#
#     environment: {}
#
#     ports:
#       - "1162:162/udp"
#       - "127.0.0.1:8282:8082/tcp"
#
#     command: []
#
# If the deployment requires UDP/162 directly, the exact Docker networking and
# capability requirements should be deliberately configured rather than
# granting the container broad privileges.
#
# No trap containers are created unless explicitly configured.
anro_ktranslate_trap_instances: []
