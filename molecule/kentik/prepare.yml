---
- name: Prepare
  hosts: all
  become: true

  tasks:
    - name: Install Docker runtime
      ansible.builtin.apt:
        name:
          - docker.io
          - ca-certificates
        state: present
        update_cache: true

    - name: Create Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Docker for nested Molecule execution
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "storage-driver": "vfs"
          }
      register: anro_ktranslate_molecule_docker_config

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: >-
          {{
            'restarted'
            if anro_ktranslate_molecule_docker_config.changed
            else 'started'
          }}
        daemon_reload: true

    - name: Wait for nested Docker daemon
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - info
      register: anro_ktranslate_molecule_docker_info
      changed_when: false
      retries: 10
      delay: 2
      until: anro_ktranslate_molecule_docker_info.rc == 0

    - name: Pull Molecule workload image
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - pull
          - ubuntu:24.04
      register: anro_ktranslate_molecule_image_pull
      changed_when: >-
        'Downloaded newer image'
        in anro_ktranslate_molecule_image_pull.stdout
