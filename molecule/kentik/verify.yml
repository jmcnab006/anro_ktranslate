---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Check Docker service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - docker.service
      register: anro_ktranslate_verify_docker_service
      changed_when: false

    - name: Check polling service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-polling-bridge-test.service
      register: anro_ktranslate_verify_polling_service
      changed_when: false

    - name: Check discovery service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-discovery-host-test.service
      register: anro_ktranslate_verify_discovery_service
      changed_when: false

    - name: Check disabled trap service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-traps-disabled-test.service
      register: anro_ktranslate_verify_trap_service
      changed_when: false
      failed_when: false

    - name: Inspect bridge Docker container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - ktranslate-polling-bridge-test
      register: anro_ktranslate_verify_bridge_inspect
      changed_when: false

    - name: Inspect host Docker container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - ktranslate-discovery-host-test
      register: anro_ktranslate_verify_host_inspect
      changed_when: false

    - name: Inspect disabled Docker container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - ktranslate-traps-disabled-test
      register: anro_ktranslate_verify_disabled_inspect
      changed_when: false
      failed_when: false

    - name: Parse Docker inspection results
      ansible.builtin.set_fact:
        anro_ktranslate_verify_bridge_container: >-
          {{
            (anro_ktranslate_verify_bridge_inspect.stdout | from_json)
            | first
          }}
        anro_ktranslate_verify_host_container: >-
          {{
            (anro_ktranslate_verify_host_inspect.stdout | from_json)
            | first
          }}

    - name: Verify Docker and systemd services
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_docker_service.stdout == 'active'
          - anro_ktranslate_verify_polling_service.stdout == 'active'
          - anro_ktranslate_verify_discovery_service.stdout == 'active'
          - anro_ktranslate_verify_trap_service.rc != 0
        fail_msg: >-
          Docker or one of the expected ktranslate systemd services is not in
          the expected state.

    - name: Verify bridge container is running
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_bridge_container.State.Running | bool
          - anro_ktranslate_verify_bridge_container.State.Status == 'running'
          - anro_ktranslate_verify_bridge_container.HostConfig.NetworkMode == 'bridge'
        fail_msg: >-
          The polling container is not running with Docker bridge networking.

    - name: Verify bridge container port publication
      ansible.builtin.assert:
        that:
          - "'8082/tcp' in anro_ktranslate_verify_bridge_container.HostConfig.PortBindings"
          - >-
            anro_ktranslate_verify_bridge_container.HostConfig.PortBindings[
              '8082/tcp'
            ][0].HostIp == '127.0.0.1'
          - >-
            anro_ktranslate_verify_bridge_container.HostConfig.PortBindings[
              '8082/tcp'
            ][0].HostPort == '18082'
        fail_msg: >-
          The bridge container did not receive the expected
          127.0.0.1:18082:8082/tcp Docker port publication.

    - name: Verify host container is running
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_host_container.State.Running | bool
          - anro_ktranslate_verify_host_container.State.Status == 'running'
          - anro_ktranslate_verify_host_container.HostConfig.NetworkMode == 'host'
        fail_msg: >-
          The discovery container is not running with Docker host networking.

    - name: Verify host container has no published ports
      ansible.builtin.assert:
        that:
          - >-
            anro_ktranslate_verify_host_container.HostConfig.PortBindings
            in [none, {}]
        fail_msg: >-
          The host-network container has Docker port bindings. Host-network
          instances must expose listeners directly through the host network
          namespace without --publish.

    - name: Verify disabled container does not exist
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_disabled_inspect.rc != 0
        fail_msg: >-
          The disabled trap instance unexpectedly has a running or stopped
          Docker container.
