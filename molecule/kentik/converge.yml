---
- name: Converge
  hosts: all
  become: true

  vars:
    ansible_connection: community.docker.docker

    anro_ktranslate_docker_binary: "/usr/bin/docker"

    # Alpine is used because this Molecule scenario is testing the role's
    # systemd/Docker lifecycle rather than ktranslate application behavior.
    #
    # Testing the actual kentik/ktranslate image should be a separate
    # application/integration scenario.
    anro_ktranslate_image: "alpine:3.20"

    # Mount the generated test configuration below /tmp because that directory
    # already exists in the Alpine image.
    anro_ktranslate_container_config_dir: "/tmp"

    anro_ktranslate_polling_instances:
      - name: bridge-test
        enabled: true
        network: bridge

        config:
          molecule_test: true
          service_type: polling

        environment:
          MOLECULE_NETWORK_MODE: "bridge"

        # Docker must publish this port because the instance uses bridge
        # networking. Nothing needs to listen on the port for this test; the
        # Docker HostConfig is verified directly in verify.yml.
        ports:
          - "127.0.0.1:18082:8082/tcp"

        command:
          - sleep
          - "3600"

    anro_ktranslate_discovery_instances:
      - name: host-test
        enabled: true
        network: host

        config:
          molecule_test: true
          service_type: discovery

        environment:
          MOLECULE_NETWORK_MODE: "host"

        # Host-network containers must not use Docker port publishing.
        ports: []

        command:
          - sleep
          - "3600"

    anro_ktranslate_trap_instances:
      - name: disabled-test
        enabled: false
        network: host

        config:
          molecule_test: true
          service_type: traps

        environment: {}
        ports: []

        command:
          - sleep
          - "3600"

  roles:
    - role: anro_ktranslate
