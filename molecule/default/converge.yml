---
- name: Converge
  hosts: all
  become: true
  vars:
    anro_ktranslate_docker_binary: "/usr/bin/docker"
    anro_ktranslate_image: "ubuntu:24.04"

    anro_ktranslate_instances:
      # Bridge instance exercises port publishing and both raw/YAML managed files.
      - name: ktranslate-polling-bridge-test
        type: polling
        enabled: true
        network: bridge
        ports:
          - "127.0.0.1:18082:8082/tcp"
        environment:
          MOLECULE_NETWORK_MODE: "bridge"
        files:
          - name: polling.yaml
            source: managed
            destination: /tmp/polling.yaml
            format: yaml
            content:
              molecule_test: true
              type: polling
          - name: banner.txt
            source: managed
            destination: /tmp/banner.txt
            format: raw
            content: |
              managed-by=anro_ktranslate
        command:
          - sleep
          - infinity

      # Host-network instance proves that no Docker --publish argument is emitted
      # and that externally owned files can be mounted through the same model.
      - name: ktranslate-discovery-host-test
        type: discovery
        enabled: true
        network: host
        environment:
          MOLECULE_NETWORK_MODE: "host"
        files:
          - name: external.conf
            source: external
            host_path: /var/lib/ktranslate-external.conf
            destination: /tmp/external.conf
        command:
          - sleep
          - infinity

      - name: ktranslate-traps-disabled-test
        type: traps
        enabled: false
        network: host
        command:
          - sleep
          - infinity

      # The workload image is Ubuntu, so this instance remains disabled. Its unit
      # verifies that omission of command inherits the role's Prometheus default.
      - name: ktranslate-default-prometheus-test
        type: polling
        enabled: false
        network: bridge

  roles:
    - role: anro_ktranslate
