---
- name: Converge
  hosts: ktranslate-ubuntu-2404
  become: true

  vars:
    anro_ktranslate_snmp_config:
      devices:
        router01:
          device_name: snmp-router01
          device_ip: 172.29.0.21
          snmp_comm: public
          snmp_ver: "2c"
          poll_time_sec: 60
          timeout_ms: 3000
          retries: 1
        router02:
          device_name: snmp-router02
          device_ip: 172.29.0.22
          snmp_comm: public
          snmp_ver: "2c"
          poll_time_sec: 60
          timeout_ms: 3000
          retries: 1
      discovery:
        cidrs:
          - 172.29.0.0/24
        ignore_list: []
        debug: true
        ports:
          - 161
        default_communities:
          - public
        use_snmp_v1: false
        default_v3: null
        add_devices: true
        add_mibs: true
        threads: 12
        replace_devices: true
        netbox:
          host: "http://172.29.0.20:8000"
          token: "molecule-test-token"
          ip_to_pick: "primary"
      global:
        poll_time_sec: 60
        drop_if_outside_poll: false
        mib_profile_dir: "/etc/ktranslate/profiles"
        mibs_db: "/etc/ktranslate/mibs.db"
        timeout_ms: 3000
        retries: 0

        netbox:
          host: "http://172.29.0.20:8000"
          token: molecule-test-token
#          tag: ktranslate
#          site: molecule
          ip_to_pick: primary

    sample_device_json_data: |
      {
        "1": {
          "id": "1",
          "company_id": "1",
          "device_name": "molecule-snmp-device",
          "device_type": "router",
          "device_status": "V",
          "device_description": "Molecule Net-SNMP test device",
          "labels": [],
          "all_interfaces": [],
          "device_flow_type": "auto",
          "device_sample_rate": "1",
          "ip": "172.19.0.2",
          "device_snmp_ip": "172.19.0.2",
          "device_snmp_community": "public",
          "minimize_snmp": false,
          "device_bgp_type": "none",
          "device_snmp_v3_conf": null
        }
      }

    anro_ktranslate_instances:
      - name: ktranslate-polling-molecule
        type: polling
        profile: polling
        enabled: true
        # Override only the arguments required by this integration scenario.
        # The remaining SNMP/Prometheus arguments are inherited from polling.
#        ktranslate_args:
#          snmp_discovery_on_start: true
#          snmp_discovery_min: 5
        image: "kentik/ktranslate:latest"
        network: ktranslate-molecule
        # Expose ktranslate from the nested Docker daemon to the Molecule
        # container. molecule.yml exposes the same port to the workstation.
        ports:
          - "0.0.0.0:18082:8082/tcp"
        environment: {}
        files:
          - name: snmp.yaml
            source: managed
            destination: /etc/ktranslate/snmp.yaml
            mode: "0644"
            format: yaml
            read_only: false
            content: "{{ _anro_ktranslate_snmp_config }}"
            # ktranslate rereads SNMP device configuration on SIGUSR2. This
            # change must not replace the running container.
            reload: signal
            reload_signal: USR2

  roles:
    - role: anro_ktranslate

  post_tasks:
    # systemd starts Docker asynchronously relative to Ansible's service-state
    # operation. Wait until Docker can inspect the named container before capturing
    # its identity for the live-reload test. This avoids racing ExecStartPre, which
    # removes any previous container immediately before docker run creates the new
    # one.
    - name: CONVERGE | Wait for polling container before live reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - ktranslate-polling-molecule
      register: _anro_ktranslate_polling_container_ready
      changed_when: false
      retries: 10
      delay: 2
      until: _anro_ktranslate_polling_container_ready.rc == 0

    - name: CONVERGE | Capture polling container ID before live reload
      ansible.builtin.set_fact:
        _anro_ktranslate_polling_container_before_reload: >-
          {{ _anro_ktranslate_polling_container_ready.stdout }}

    # Change only SNMP file content. This gives Ansible a deterministic managed
    # file change while keeping systemd, environment, mounts, and command stable.
    - name: CONVERGE | Change signal-bound SNMP configuration
      ansible.builtin.set_fact:
        anro_ktranslate_snmp_config: >-
          {{ anro_ktranslate_snmp_config | combine({'global': {'poll_time_sec': 61}}, recursive=true) }}

    - name: CONVERGE | Reapply role to exercise live reload
      ansible.builtin.include_role:
        name: anro_ktranslate

    # A signal reload must leave the Docker object intact. Waiting here also gives
    # systemd enough time to expose an unintended restart/recreation before the
    # assertion is evaluated.
    - name: CONVERGE | Inspect polling container after live reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - ktranslate-polling-molecule
      register: _anro_ktranslate_polling_container_after_reload
      changed_when: false
      retries: 10
      delay: 2
      until: _anro_ktranslate_polling_container_after_reload.rc == 0

    - name: CONVERGE | Verify live reload preserved polling container
      ansible.builtin.assert:
        that:
          - >-
            _anro_ktranslate_polling_container_before_reload ==
            _anro_ktranslate_polling_container_after_reload.stdout
        fail_msg: >-
          The polling container was recreated while applying a signal-reloadable
          configuration change. Expected SIGUSR2 reload without container restart.
        success_msg: >-
          The polling container retained its Docker ID across the live reload.
