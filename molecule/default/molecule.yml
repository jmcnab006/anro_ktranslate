---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: docker

platforms:
  - name: ktranslate-jammy
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - ktranslate_collectors
  - name: ktranslate-noble
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - ktranslate_collectors

provisioner:
  name: ansible
  inventory:
    group_vars:
      ktranslate_collectors:
        anro_ktranslate_install_method: preinstalled
        anro_ktranslate_binary_path: /usr/bin/ktranslate
        anro_ktranslate_prometheus_listen: "0.0.0.0:8082"
        anro_ktranslate_validate_host: "127.0.0.1"
        anro_ktranslate_validate_port: 8082
        anro_ktranslate_enable_net_raw: false
        anro_ktranslate_extra_flags:
          - "-metrics_jchf=false"
        anro_ktranslate_snmp_config:
          devices:
            test-router:
              device_name: test-router
              device_ip: 192.0.2.10
              snmp_version: v2
              community: molecule-community
              mibs:
                - IF-MIB
          trap:
            listen: "127.0.0.1:1620"
            community: molecule-trap
            version: ""
            transport: ""
          discovery:
            cidrs:
              - "192.0.2.0/30"
            ignore_list:
              - "192.0.2.1/32"
            debug: true
            ports: [161]
            default_communities:
              - molecule-community
            default_v3: null
            add_devices: true
            add_mibs: true
            threads: 2
            replace_devices: true
            check_all_ips: false
            use_snmp_v1: false
          global:
            poll_time_sec: 30
            drop_if_outside_poll: false
            mib_profile_dir: /etc/ktranslate/profiles
            mibs_db: /etc/ktranslate/mibs.db
            mibs_enabled: [IF-MIB]
            timeout_ms: 1000
            retries: 1
            global_v3: null
            response_time: false
            ping_interval_sec: 60
            jitter_time_sec: 5
            fast_poll: false
            watch_profile_changes: false
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
