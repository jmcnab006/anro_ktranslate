---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ktranslate-ubuntu-2404
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: "/lib/systemd/systemd"
    env:
      container: docker

    docker_networks:
      - name: ktranslate-molecule
        ipam_config:
          - subnet: "172.29.0.0/24"
            gateway: "172.29.0.1"

    # Expose the nested ktranslate Prometheus endpoint to the workstation.
    # ktranslate -> Molecule host: 18082
    # Molecule host -> workstation: 18082
    published_ports:
      - "127.0.0.1:18082:18082"

    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

    tmpfs:
      - /run
      - /tmp
    networks:
      - name: ktranslate-molecule
        ipv4_address: 172.29.0.10

  - name: netbox-mock
    image: "python:3.13-alpine"
    pre_build_image: true
    command: "python3 /mock/server.py"
    volumes:
      - "${MOLECULE_SCENARIO_DIRECTORY}/files/netbox-mock:/mock:ro"
    networks:
      - name: ktranslate-molecule
        ipv4_address: "172.29.0.20"

