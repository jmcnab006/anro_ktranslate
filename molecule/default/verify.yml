---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: VERIFY | Confirm ktranslate service is active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - ktranslate-polling-molecule.service
      register: anro_ktranslate_verify_service
      changed_when: false
      failed_when: anro_ktranslate_verify_service.stdout != 'active'

    - name: VERIFY | Confirm SNMP test device returns sysUpTime
      ansible.builtin.command:
        argv:
          - /usr/bin/snmpget
          - -v2c
          - -c
          - public
          - 127.0.0.1:1161
          - 1.3.6.1.2.1.1.3.0
      register: anro_ktranslate_verify_snmp
      changed_when: false

    - name: VERIFY | Wait for ktranslate Prometheus endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:18082/metrics
        method: GET
        return_content: true
        status_code: 200
      register: anro_ktranslate_verify_prometheus
      retries: 20
      delay: 3
      until:
        - anro_ktranslate_verify_prometheus.status == 200
        - >-
          'sysUpTime'
          in anro_ktranslate_verify_prometheus.content

    - name: VERIFY | Assert SNMP metric was exported
      ansible.builtin.assert:
        that:
          - "'sysUpTime' in anro_ktranslate_verify_prometheus.content"
        fail_msg: >-
          ktranslate did not expose the expected sysUpTime SNMP metric on its
          Prometheus endpoint.
