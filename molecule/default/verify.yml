---
- name: Verify
  hosts: ktranslate-ubuntu-2404
  become: true
  gather_facts: false
  vars_files:
    - vars/main.yaml

  tasks:
    # These disabled instances exercise both supported no-profile forms. Their
    # successful unit creation proves omitted and null type values normalize from
    # global defaults directly into instance configuration.
    - name: VERIFY | Confirm untyped instances were accepted
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - "{{ item }}.service"
      loop:
        - ktranslate-untyped-molecule
        - ktranslate-null-type-molecule
      register: anro_ktranslate_verify_untyped_services
      changed_when: false
      failed_when: anro_ktranslate_verify_untyped_services.stdout != 'disabled'

    # Unknown non-empty types must fail during validation, before lifecycle tasks
    # can alter the already-running Molecule services.
    - name: VERIFY | Initialize unknown type validation state
      ansible.builtin.set_fact:
        anro_ktranslate_unknown_type_failed: false

    - name: VERIFY | Reject unknown non-empty type
      block:
        - name: VERIFY | Apply role with unknown type
          ansible.builtin.include_role:
            name: anro_ktranslate
          vars:
            anro_ktranslate_instances:
              - name: ktranslate-invalid-type-molecule
                type: does-not-exist
                enabled: false
      rescue:
        - name: VERIFY | Record expected unknown type failure
          ansible.builtin.set_fact:
            anro_ktranslate_unknown_type_failed: true

    - name: VERIFY | Assert unknown type was rejected
      ansible.builtin.assert:
        that:
          - anro_ktranslate_unknown_type_failed | bool
        fail_msg: >-
          A non-empty type that is not defined in anro_ktranslate_profiles must
          fail validation before any instance lifecycle changes are applied.

    - name: VERIFY | Confirm both polling services are active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}.service"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
        - ktranslate-discovery-molecule
      register: anro_ktranslate_verify_services
      changed_when: false
      failed_when: anro_ktranslate_verify_services.stdout != 'active'

    # Discovery output is runtime-owned. Retry because SNMP discovery happens
    # asynchronously after systemd reports the container active.
    - name: VERIFY | Wait for discovery output to contain a simulator
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -E
          - 'router01|router02|172.29.0.(21|22)'
          - /etc/ktranslate/ktranslate-discovery-molecule/discovery.yaml
      register: anro_ktranslate_verify_discovery_output
      changed_when: false
      retries: 20
      delay: 3
      until: anro_ktranslate_verify_discovery_output.rc == 0

    - name: VERIFY | Confirm discovery profile has no polling sink
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{json .Config.Cmd}}' }}"
          - ktranslate-discovery-molecule
      register: anro_ktranslate_verify_discovery_command
      changed_when: false

    - name: VERIFY | Assert discovery remains output-only
      ansible.builtin.assert:
        that:
          - "'-snmp_out_file=/etc/ktranslate/discovery.yaml' in anro_ktranslate_verify_discovery_command.stdout"
          - "'-sinks=' not in anro_ktranslate_verify_discovery_command.stdout"
          - "'-prom_listen=' not in anro_ktranslate_verify_discovery_command.stdout"
        fail_msg: >-
          Discovery must write raw inventory without configuring a polling sink
          or Prometheus listener.

    # The two service instances deliberately use different configuration paths:
    # one is fully Ansible-managed and one is assembled from Ansible policy plus
    # the remote devices mapping.
    - name: VERIFY | Read generated SNMP configurations
      ansible.builtin.slurp:
        src: "/etc/ktranslate/{{ item }}/snmp.yaml"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
      register: anro_ktranslate_verify_snmp_files

    - name: VERIFY | Parse generated SNMP configurations
      ansible.builtin.set_fact:
        anro_ktranslate_verify_ansible_config: >-
          {{ anro_ktranslate_verify_snmp_files.results[0].content | b64decode | from_yaml }}
        anro_ktranslate_verify_url_config: >-
          {{ anro_ktranslate_verify_snmp_files.results[1].content | b64decode | from_yaml }}

    - name: VERIFY | Confirm both configuration methods produced expected policy and devices
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_ansible_config.global.poll_time_sec == 60
          - anro_ktranslate_verify_url_config.global.poll_time_sec == 60
          - anro_ktranslate_verify_ansible_config.devices | length == 2
          - anro_ktranslate_verify_url_config.devices | length == 2
          - anro_ktranslate_verify_url_config.devices.router01.device_ip == '172.29.0.21'
          - anro_ktranslate_verify_url_config.devices.router02.device_ip == '172.29.0.22'
        fail_msg: >-
          The Ansible-only and URL-merged configuration paths did not produce
          the expected ktranslate SNMP policy and device inventory.

    - name: VERIFY | Wait for both Prometheus endpoints
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/metrics"
        method: GET
        status_code: 200
      loop:
        - 18082
        - 18083
      register: anro_ktranslate_verify_prometheus
      retries: 20
      delay: 3
      until: anro_ktranslate_verify_prometheus.status == 200

    # Capture both IDs so the test proves a device_source update affects neither
    # the URL-backed container identity nor the independent Ansible-only service.
    - name: VERIFY | Capture polling container IDs before device source reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "{{ item }}"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
      register: anro_ktranslate_container_ids_before_reload
      changed_when: false
      retries: 10
      delay: 2
      until: anro_ktranslate_container_ids_before_reload.rc == 0

    # Change only remote device data. Global polling policy remains unchanged in
    # Ansible, which verifies the ownership boundary implemented by device_source.
    - name: VERIFY | Publish changed remote device inventory
      ansible.builtin.copy:
        dest: /srv/ktranslate-config/devices.yaml
        owner: root
        group: root
        mode: "0644"
        content: >-
          {{
            anro_ktranslate_molecule_devices
            | combine(
                {'devices': {'router02': {'poll_time_sec': 61}}},
                recursive=true
              )
            | to_nice_yaml(indent=2, sort_keys=false)
          }}
      delegate_to: ktranslate-config-web
      become: false

    - name: VERIFY | Reapply role to exercise device source live reload
      ansible.builtin.include_role:
        name: anro_ktranslate

    - name: VERIFY | Read URL-merged configuration after live reload
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_after_reload

    - name: VERIFY | Inspect polling containers after device source live reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "{{ item }}"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
      register: anro_ktranslate_container_ids_after_reload
      changed_when: false

    - name: VERIFY | Confirm device source changed only effective data without container replacement
      ansible.builtin.assert:
        that:
          - >-
            (anro_ktranslate_url_config_after_reload.content | b64decode | from_yaml).devices.router02.poll_time_sec == 61
          - >-
            anro_ktranslate_container_ids_before_reload.results[0].stdout ==
            anro_ktranslate_container_ids_after_reload.results[0].stdout
          - >-
            anro_ktranslate_container_ids_before_reload.results[1].stdout ==
            anro_ktranslate_container_ids_after_reload.results[1].stdout
        fail_msg: >-
          device_source did not update the assembled SNMP configuration through
          live reload while preserving both polling container identities.

    - name: VERIFY | Read active URL-merged configuration before failed download
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_before_failed_download

    - name: VERIFY | Point device source at an unavailable URL
      ansible.builtin.set_fact:
        anro_ktranslate_molecule_device_source_url: http://172.29.0.20:8080/missing-devices.yaml

    - name: VERIFY | Initialize expected device source failure state
      ansible.builtin.set_fact:
        anro_ktranslate_device_source_failed: false

    # The role is expected to fail during device_source download. Rescue records
    # that expected failure so subsequent assertions can prove fail-closed state.
    - name: VERIFY | Exercise failed device source download
      block:
        - name: VERIFY | Reapply role with unavailable device source
          ansible.builtin.include_role:
            name: anro_ktranslate
      rescue:
        - name: VERIFY | Record expected device source failure
          ansible.builtin.set_fact:
            anro_ktranslate_device_source_failed: true

    - name: VERIFY | Read URL-merged configuration after failed download
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_after_failed_download

    - name: VERIFY | Inspect URL-backed container after failed download
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - ktranslate-polling-url
      register: anro_ktranslate_url_container_after_failed_download
      changed_when: false

    - name: VERIFY | Confirm failed device source left active state untouched
      ansible.builtin.assert:
        that:
          - anro_ktranslate_device_source_failed | bool
          - >-
            anro_ktranslate_url_config_before_failed_download.content ==
            anro_ktranslate_url_config_after_failed_download.content
          - >-
            anro_ktranslate_container_ids_after_reload.results[1].stdout ==
            anro_ktranslate_url_container_after_failed_download.stdout
        fail_msg: >-
          A failed device_source download changed active configuration or
          replaced the running URL-backed polling container.
