---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather polling service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-polling-site-a.service
      register: anro_ktranslate_verify_polling_active
      changed_when: false

    - name: Gather discovery service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-discovery-site-a.service
      register: anro_ktranslate_verify_discovery_active
      changed_when: false

    - name: Gather trap service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-traps-site-a.service
      register: anro_ktranslate_verify_trap_active
      changed_when: false
      failed_when: false

    - name: Verify rendered files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/ktranslate-polling-site-a.service
        - /etc/systemd/system/ktranslate-discovery-site-a.service
        - /etc/systemd/system/ktranslate-traps-site-a.service
        - /etc/ktranslate/ktranslate-polling-site-a/config.yaml
        - /etc/ktranslate/environment/ktranslate-polling-site-a.env
      register: anro_ktranslate_verify_files

    - name: Assert expected ktranslate state
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_polling_active.stdout == 'active'
          - anro_ktranslate_verify_discovery_active.stdout == 'active'
          - anro_ktranslate_verify_trap_active.rc != 0
          - anro_ktranslate_verify_files.results | map(attribute='stat.exists') | min
