---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: VERIFY | Check Docker service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - docker.service
      register: anro_ktranslate_verify_docker_active
      changed_when: false

    - name: VERIFY | Check enabled ktranslate service states
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}.service"
      loop:
        - ktranslate-polling-bridge-test
        - ktranslate-discovery-host-test
      register: anro_ktranslate_verify_enabled_services
      changed_when: false

    - name: VERIFY | Check disabled ktranslate service states
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}.service"
      loop:
        - ktranslate-traps-disabled-test
        - ktranslate-default-prometheus-test
      register: anro_ktranslate_verify_disabled_services
      changed_when: false
      failed_when: false

    - name: VERIFY | Inspect bridge container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - ktranslate-polling-bridge-test
      register: anro_ktranslate_verify_bridge_inspect
      changed_when: false

    - name: VERIFY | Inspect host-network container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - ktranslate-discovery-host-test
      register: anro_ktranslate_verify_host_inspect
      changed_when: false

    - name: VERIFY | Inspect disabled containers
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "{{ item }}"
      loop:
        - ktranslate-traps-disabled-test
        - ktranslate-default-prometheus-test
      register: anro_ktranslate_verify_disabled_inspect
      changed_when: false
      failed_when: false

    - name: VERIFY | Read managed file from bridge container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - ktranslate-polling-bridge-test
          - cat
          - /tmp/banner.txt
      register: anro_ktranslate_verify_managed_file
      changed_when: false

    - name: VERIFY | Read external file from host-network container
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - exec
          - ktranslate-discovery-host-test
          - cat
          - /tmp/external.conf
      register: anro_ktranslate_verify_external_file
      changed_when: false

    - name: VERIFY | Read default Prometheus unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/ktranslate-default-prometheus-test.service
      register: anro_ktranslate_verify_default_unit

    - name: VERIFY | Parse Docker inspection results
      ansible.builtin.set_fact:
        anro_ktranslate_verify_bridge: "{{ anro_ktranslate_verify_bridge_inspect.stdout | from_json | first }}"
        anro_ktranslate_verify_host: "{{ anro_ktranslate_verify_host_inspect.stdout | from_json | first }}"
        anro_ktranslate_verify_default_unit_text: "{{ anro_ktranslate_verify_default_unit.content | b64decode }}"

    # Verify resulting runtime state rather than merely checking that Ansible
    # implementation tasks completed successfully.
    - name: VERIFY | Assert expected ktranslate runtime state
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_docker_active.stdout == 'active'
          - >-
            anro_ktranslate_verify_enabled_services.results
            | map(attribute='stdout') | list == ['active', 'active']
          - >-
            anro_ktranslate_verify_disabled_services.results
            | map(attribute='rc') | select('ne', 0) | list | length == 2
          - anro_ktranslate_verify_bridge.State.Running
          - anro_ktranslate_verify_bridge.HostConfig.NetworkMode == 'bridge'
          - anro_ktranslate_verify_bridge.HostConfig.PortBindings['8082/tcp'][0].HostIp == '127.0.0.1'
          - anro_ktranslate_verify_bridge.HostConfig.PortBindings['8082/tcp'][0].HostPort == '18082'
          - anro_ktranslate_verify_host.State.Running
          - anro_ktranslate_verify_host.HostConfig.NetworkMode == 'host'
          - anro_ktranslate_verify_host.HostConfig.PortBindings in [none, {}]
          - >-
            anro_ktranslate_verify_disabled_inspect.results
            | map(attribute='rc') | select('ne', 0) | list | length == 2
          - "'managed-by=anro_ktranslate' in anro_ktranslate_verify_managed_file.stdout"
          - "'ownership=external' in anro_ktranslate_verify_external_file.stdout"
          - "'-format=prometheus' in anro_ktranslate_verify_default_unit_text"
          - "'-sinks=prometheus' in anro_ktranslate_verify_default_unit_text"
          - "'-prom_listen=:8082' in anro_ktranslate_verify_default_unit_text"
