---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather bridge service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-polling-bridge-test.service
      register: anro_ktranslate_verify_bridge_active
      changed_when: false

    - name: Gather host service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ktranslate-discovery-host-test.service
      register: anro_ktranslate_verify_host_active
      changed_when: false

    - name: Read bridge systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/ktranslate-polling-bridge-test.service
      register: anro_ktranslate_verify_bridge_unit

    - name: Read host systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/ktranslate-discovery-host-test.service
      register: anro_ktranslate_verify_host_unit

    - name: Decode generated systemd units
      ansible.builtin.set_fact:
        anro_ktranslate_verify_bridge_unit_content: >-
          {{
            anro_ktranslate_verify_bridge_unit.content
            | b64decode
          }}
        anro_ktranslate_verify_host_unit_content: >-
          {{
            anro_ktranslate_verify_host_unit.content
            | b64decode
          }}

    - name: Verify bridge networking configuration
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_bridge_active.stdout == 'active'
          - >-
            '--network bridge'
            in anro_ktranslate_verify_bridge_unit_content
          - >-
            '--publish 18082:8082/tcp'
            in anro_ktranslate_verify_bridge_unit_content
        fail_msg: >-
          The bridge ktranslate service did not render the expected Docker
          bridge network and published port configuration.
        success_msg: >-
          Bridge networking correctly renders --network bridge and the
          configured --publish argument.

    - name: Verify host networking configuration
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_host_active.stdout == 'active'
          - >-
            '--network host'
            in anro_ktranslate_verify_host_unit_content
          - >-
            '--publish'
            not in anro_ktranslate_verify_host_unit_content
        fail_msg: >-
          The host-networked ktranslate service did not render correctly.
          Host networking must use --network host and must not contain
          Docker --publish arguments.
        success_msg: >-
          Host networking correctly renders --network host without any
          --publish arguments.