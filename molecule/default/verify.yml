---
- name: Verify
  hosts: ktranslate-ubuntu-2404
  become: true
  gather_facts: false
  vars_files:
    - vars/main.yaml

  tasks:
    # These disabled instances exercise both supported no-profile forms. Their
    # successful unit creation proves omitted and null type values normalize from
    # global defaults directly into instance configuration.
    - name: VERIFY | Confirm untyped instances were accepted
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - "{{ item }}.service"
      loop:
        - ktranslate-untyped-molecule
        - ktranslate-null-type-molecule
      register: anro_ktranslate_verify_untyped_services
      changed_when: false
      failed_when: anro_ktranslate_verify_untyped_services.stdout != 'disabled'

    # Run expected-failure cases in child ansible-playbook processes. This keeps
    # the parent Molecule verify play free of fatal/rescued task output while the
    # child still exercises the real role against the Molecule instance.
    - name: VERIFY | Run unknown type rejection test
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_INVENTORY_FILE') }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/verify_invalid_type.yml"
          - --extra-vars
          - >-
            {"anro_ktranslate_instances":[
              {"name":"ktranslate-invalid-type-molecule",
               "type":"does-not-exist",
               "enabled":false}
            ]}
      delegate_to: localhost
      become: false
      register: anro_ktranslate_invalid_type_test
      changed_when: false
      failed_when: false

    - name: VERIFY | Assert unknown type was rejected
      ansible.builtin.assert:
        that:
          - anro_ktranslate_invalid_type_test.rc != 0
          - >-
            "selects unknown type 'does-not-exist'" in
            (anro_ktranslate_invalid_type_test.stdout ~ anro_ktranslate_invalid_type_test.stderr)
        fail_msg: >-
          The child validation play did not reject the unknown non-empty type
          with the expected validation error.

    - name: VERIFY | Confirm both polling services are active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ item }}.service"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
        - ktranslate-discovery-molecule
        - ktranslate-traps-molecule
      register: anro_ktranslate_verify_services
      changed_when: false
      failed_when: anro_ktranslate_verify_services.stdout != 'active'

    # Discovery output is runtime-owned. Retry because SNMP discovery happens
    # asynchronously after systemd reports the container active.
    - name: VERIFY | Wait for discovery output to contain a simulator
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -E
          - 'router01|router02|172.29.0.(21|22)'
          - /etc/ktranslate/ktranslate-discovery-molecule/runtime/discovery.yaml
      register: anro_ktranslate_verify_discovery_output
      changed_when: false
      retries: 20
      delay: 3
      until: anro_ktranslate_verify_discovery_output.rc == 0

    - name: VERIFY | Confirm discovery profile has no polling sink
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{json .Config.Cmd}}' }}"
          - ktranslate-discovery-molecule
      register: anro_ktranslate_verify_discovery_command
      changed_when: false

    - name: VERIFY | Assert discovery remains output-only
      ansible.builtin.assert:
        that:
          - "'-snmp_out_file=/etc/ktranslate/runtime/discovery.yaml' in anro_ktranslate_verify_discovery_command.stdout"
          - "'-sinks=' not in anro_ktranslate_verify_discovery_command.stdout"
          - "'-prom_listen=' not in anro_ktranslate_verify_discovery_command.stdout"
        fail_msg: >-
          Discovery must write raw inventory without configuring a polling sink
          or Prometheus listener.

    - name: VERIFY | Inspect traps container command
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{json .Config.Cmd}}' }}"
          - ktranslate-traps-molecule
      register: anro_ktranslate_verify_traps_command
      changed_when: false

    - name: VERIFY | Assert traps profile uses the runtime file sink
      ansible.builtin.assert:
        that:
          - "'-sinks=file' in anro_ktranslate_verify_traps_command.stdout"
          - "'-file_out=/etc/ktranslate/runtime' in anro_ktranslate_verify_traps_command.stdout"
          - "'-file_on=true' in anro_ktranslate_verify_traps_command.stdout"
        fail_msg: >-
          The traps instance must listen on UDP 1620 and write received events to
          the dedicated runtime file sink.

    # The unique enterprise varbind proves ktranslate received this test trap,
    # rather than merely proving that the UDP listener started successfully.
    - name: VERIFY | Send deterministic SNMPv2c trap to ktranslate
      ansible.builtin.command:
        argv:
          - /usr/bin/snmptrap
          - -v
          - "2c"
          - -c
          - public
          - 127.0.0.1:11620
          - ""
          - 1.3.6.1.6.3.1.1.5.1
          - 1.3.6.1.4.1.8072.9999.1.0
          - s
          - anro-ktranslate-molecule-trap
      changed_when: false

    - name: VERIFY | Wait for deterministic trap in file sink output
      ansible.builtin.command:
        argv:
          - /usr/bin/grep
          - -R
          - -F
          - anro-ktranslate-molecule-trap
          - /etc/ktranslate/ktranslate-traps-molecule/runtime
      register: anro_ktranslate_verify_trap_output
      changed_when: false
      retries: 15
      delay: 1
      until: anro_ktranslate_verify_trap_output.rc == 0

    # Verify local-only, URL+local, and baseline-only effective SNMP configuration.
    - name: VERIFY | Read generated SNMP configurations
      ansible.builtin.slurp:
        src: "/etc/ktranslate/{{ item }}/snmp.yaml"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
        - ktranslate-baseline-molecule
      register: anro_ktranslate_verify_snmp_files

    - name: VERIFY | Inspect generated SNMP configuration permissions
      ansible.builtin.stat:
        path: "/etc/ktranslate/{{ item }}/snmp.yaml"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
        - ktranslate-baseline-molecule
      register: anro_ktranslate_verify_snmp_stats

    - name: VERIFY | Confirm generated SNMP configurations are container-readable
      ansible.builtin.assert:
        that:
          - item.stat.mode == '0644'
      loop: "{{ anro_ktranslate_verify_snmp_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: VERIFY | Inspect instance configuration directory permissions
      ansible.builtin.stat:
        path: "/etc/ktranslate/{{ item }}"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
        - ktranslate-baseline-molecule
      register: anro_ktranslate_verify_config_dir_stats

    - name: VERIFY | Confirm instance configuration directories are traversable
      ansible.builtin.assert:
        that:
          - item.stat.mode == '0755'
      loop: "{{ anro_ktranslate_verify_config_dir_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: VERIFY | Parse generated SNMP configurations
      ansible.builtin.set_fact:
        anro_ktranslate_verify_ansible_config: >-
          {{ anro_ktranslate_verify_snmp_files.results[0].content | b64decode | from_yaml }}
        anro_ktranslate_verify_url_config: >-
          {{ anro_ktranslate_verify_snmp_files.results[1].content | b64decode | from_yaml }}
        anro_ktranslate_verify_baseline_config: >-
          {{ anro_ktranslate_verify_snmp_files.results[2].content | b64decode | from_yaml }}

    - name: VERIFY | Confirm both configuration methods produced expected policy and devices
      ansible.builtin.assert:
        that:
          - anro_ktranslate_verify_ansible_config.global.poll_time_sec == 60
          - anro_ktranslate_verify_url_config.global.poll_time_sec == 30
          - anro_ktranslate_verify_url_config.global.timeout_ms == 3000
          - anro_ktranslate_verify_ansible_config.devices | length == 2
          - anro_ktranslate_verify_url_config.devices | length == 2
          - anro_ktranslate_verify_url_config.devices.router01.device_ip == '172.29.0.21'
          - anro_ktranslate_verify_url_config.devices.router02.device_ip == '172.29.0.22'
          - anro_ktranslate_verify_baseline_config.global.poll_time_sec == 60
          - anro_ktranslate_verify_baseline_config.devices == {}
          - anro_ktranslate_verify_baseline_config.discovery is not defined
          - anro_ktranslate_verify_baseline_config.trap is not defined
        fail_msg: >-
          The Ansible-only and URL-merged configuration paths did not produce
          the expected ktranslate SNMP policy and device inventory.

    - name: VERIFY | Wait for both Prometheus endpoints
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/metrics"
        method: GET
        status_code: 200
      loop:
        - 18082
        - 18083
      register: anro_ktranslate_verify_prometheus
      retries: 20
      delay: 3
      until: anro_ktranslate_verify_prometheus.status == 200

    # Capture both IDs so the test proves a URL configuration update affects neither
    # the URL-backed container identity nor the independent Ansible-only service.
    - name: VERIFY | Capture polling container IDs before URL configuration reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "{{ item }}"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
      register: anro_ktranslate_container_ids_before_reload
      changed_when: false
      retries: 10
      delay: 2
      until: anro_ktranslate_container_ids_before_reload.rc == 0

    # Change only remote device data. Global polling policy remains unchanged in
    # Ansible, which verifies the ownership boundary implemented by URL configuration.
    - name: VERIFY | Publish changed remote device inventory
      ansible.builtin.copy:
        dest: /srv/ktranslate-config/devices.yaml
        owner: root
        group: root
        mode: "0644"
        content: >-
          {{
            anro_ktranslate_molecule_devices
            | combine(
                {'devices': {'router02': {'poll_time_sec': 61}}},
                recursive=true
              )
            | to_nice_yaml(indent=2, sort_keys=false)
          }}
      delegate_to: ktranslate-config-web
      become: false

    - name: VERIFY | Reapply role to exercise URL configuration live reload
      ansible.builtin.include_role:
        name: anro_ktranslate

    - name: VERIFY | Read URL-merged configuration after live reload
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_after_reload

    - name: VERIFY | Inspect polling containers after URL configuration live reload
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - "{{ item }}"
      loop:
        - ktranslate-polling-ansible
        - ktranslate-polling-url
      register: anro_ktranslate_container_ids_after_reload
      changed_when: false

    - name: VERIFY | Confirm URL configuration changed only effective data without container replacement
      ansible.builtin.assert:
        that:
          - >-
            (anro_ktranslate_url_config_after_reload.content | b64decode | from_yaml).devices.router02.poll_time_sec == 61
          - >-
            anro_ktranslate_container_ids_before_reload.results[0].stdout ==
            anro_ktranslate_container_ids_after_reload.results[0].stdout
          - >-
            anro_ktranslate_container_ids_before_reload.results[1].stdout ==
            anro_ktranslate_container_ids_after_reload.results[1].stdout
        fail_msg: >-
          URL configuration did not update the assembled SNMP configuration through
          live reload while preserving both polling container identities.

    - name: VERIFY | Read active URL-merged configuration before failed download
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_before_failed_download

    - name: VERIFY | Run unavailable URL configuration rejection test
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_INVENTORY_FILE') }}"
          - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/verify_missing_url.yml"
          - --extra-vars
          - >-
            {"anro_ktranslate_molecule_config_url":
            "http://172.29.0.20:8080/missing-devices.yaml"}
      delegate_to: localhost
      become: false
      register: anro_ktranslate_missing_url_test
      changed_when: false
      failed_when: false

    - name: VERIFY | Assert unavailable URL configuration was rejected
      ansible.builtin.assert:
        that:
          - anro_ktranslate_missing_url_test.rc != 0
          - >-
            'HTTP Error 404' in
            (
              anro_ktranslate_missing_url_test.stdout
              ~ anro_ktranslate_missing_url_test.stderr
            )
        fail_msg: >-
          The child URL configuration play did not reject the unavailable inventory
          URL with the expected HTTP 404 failure.
    - name: VERIFY | Read URL-merged configuration after failed download
      ansible.builtin.slurp:
        src: /etc/ktranslate/ktranslate-polling-url/snmp.yaml
      register: anro_ktranslate_url_config_after_failed_download

    - name: VERIFY | Inspect URL-backed container after failed download
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - "--format={{ '{{.Id}}' }}"
          - ktranslate-polling-url
      register: anro_ktranslate_url_container_after_failed_download
      changed_when: false

    - name: VERIFY | Confirm failed URL configuration left active state untouched
      ansible.builtin.assert:
        that:
          - >-
            anro_ktranslate_url_config_before_failed_download.content ==
            anro_ktranslate_url_config_after_failed_download.content
          - >-
            anro_ktranslate_container_ids_after_reload.results[1].stdout ==
            anro_ktranslate_url_container_after_failed_download.stdout
        fail_msg: >-
          A failed URL configuration download changed active configuration or
          replaced the running URL-backed polling container.
