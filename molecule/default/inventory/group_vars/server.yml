---
# Docker configuration for Molecule testing.
ansible_connection: community.docker.docker

container_command: /lib/systemd/systemd # noqa: var-naming[no-role-prefix]
container_privileged: true # noqa: var-naming[no-role-prefix]
container_log_driver: json-file # noqa: var-naming[no-role-prefix]
container_volumes: # noqa: var-naming[no-role-prefix]
  - /sys/fs/cgroup:/sys/fs/cgroup:rw
container_tmpfs: # noqa: var-naming[no-role-prefix]
  - /run
  - /tmp
#container_published_ports: # noqa: var-naming[no-role-prefix]
#  - 8081:443
#  - 8080:80
#  - 9117:9117

# Role test variables.
anro_ktranslate_docker_binary: "/usr/local/bin/mock-docker"
anro_ktranslate_image: "kentik/ktranslate:test"

# Verify the default bridge behavior. This instance should render both
# --network bridge and the configured --publish argument.
anro_ktranslate_polling_instances:
  - name: bridge-test
    enabled: true
    network: bridge
    config:
      sinks:
        - prometheus
      prometheus_sink:
        listen_addr: ":8082"
    environment:
      TEST_VALUE: "bridge"
    ports:
      - "18082:8082/tcp"
    command:
      - "-config"
      - "/etc/ktranslate/config.yaml"

# Host networking shares the host network namespace directly. No Docker
# port mappings are configured because --publish is not applicable when
# using --network host.
anro_ktranslate_discovery_instances:
  - name: host-test
    enabled: true
    network: host
    config:
      sinks:
        - prometheus
      prometheus_sink:
        listen_addr: ":18083"
    environment:
      TEST_VALUE: "host"
    ports: []
    command:
      - "-config"
      - "/etc/ktranslate/config.yaml"

anro_ktranslate_trap_instances: []