---
anro_ktranslate_molecule_device_source_url: http://172.29.0.20:8080/devices.yaml

# Collector policy is owned by Ansible for both test instances. The URL-backed
# instance merges only the remote devices mapping into this structure.
anro_ktranslate_molecule_snmp_base_config:
  global:
    poll_time_sec: 60
    timeout_ms: 3000
    retries: 1
    drop_if_outside_poll: false
    mib_profile_dir: /etc/ktranslate/profiles
    mibs_db: /etc/ktranslate/mibs.db
    mibs_enabled:
      - HOST-RESOURCES-MIB
  trap:
    listen: "0.0.0.0:1620"
  discovery:
    cidrs: []
    ports:
      - 161
    default_communities:
      - public
    add_devices: false
    add_mibs: true
    threads: 4

# This inventory is published by the Molecule HTTP peer for device_source.
# Per-device polling fields are included to keep the fixture directly usable by
# ktranslate without allowing the remote source to control global policy.
anro_ktranslate_molecule_devices:
  devices:
    router01:
      device_name: router01
      device_ip: 172.29.0.21
      snmp_comm: public
      snmp_ver: "2c"
      poll_time_sec: 60
      timeout_ms: 3000
      retries: 1
    router02:
      device_name: router02
      device_ip: 172.29.0.22
      snmp_comm: public
      snmp_ver: "2c"
      poll_time_sec: 60
      timeout_ms: 3000
      retries: 1

# The first service exercises a configuration supplied entirely by Ansible.
anro_ktranslate_molecule_ansible_snmp_config: >-
  {{
    anro_ktranslate_molecule_snmp_base_config
    | combine({'devices': anro_ktranslate_molecule_devices.devices}, recursive=false)
  }}


# Discovery uses the same SNMP simulator peers but has no polling sink. Its only
# runtime product is raw discovery.yaml, which remains isolated from pollers.
anro_ktranslate_molecule_discovery_snmp_config:
  global:
    poll_time_sec: 60
    timeout_ms: 3000
    retries: 1
    # ktranslate discovery requires a MIB profile directory in the global
    # section even when discovery is only generating raw device inventory.
    mib_profile_dir: /etc/ktranslate/profiles
  discovery:
    cidrs:
      - 172.29.0.21/32
      - 172.29.0.22/32
    ports:
      - 161
    default_communities:
      - public
    add_devices: true
    add_mibs: true
    threads: 4

anro_ktranslate_instances:
  - name: ktranslate-polling-ansible
    type: polling
    enabled: true
    network: ktranslate-molecule
    ports:
      - "0.0.0.0:18082:8082/tcp"
    files:
      - name: snmp.yaml
        source: managed
        destination: /etc/ktranslate/snmp.yaml
        format: yaml
        mode: "0644"
        read_only: true
        content: "{{ anro_ktranslate_molecule_ansible_snmp_config }}"
        reload: signal
        reload_signal: USR2

  # The second service owns the same global policy in Ansible but obtains only
  # device membership from the external HTTP fixture.
  - name: ktranslate-polling-url
    type: polling
    enabled: true
    network: ktranslate-molecule
    ports:
      - "0.0.0.0:18083:8082/tcp"
    device_source:
      url: "{{ anro_ktranslate_molecule_device_source_url }}"
      validate_certs: true
      config: "{{ anro_ktranslate_molecule_snmp_base_config }}"
      name: snmp.yaml
      destination: /etc/ktranslate/snmp.yaml
      mode: "0644"
      read_only: true
      reload: signal
      reload_signal: USR2

  # Discovery is intentionally output-only: no sink or Prometheus listener is
  # configured, and the generated discovery.yaml is never consumed by pollers.
  - name: ktranslate-discovery-molecule
    type: discovery
    enabled: true
    network: ktranslate-molecule
    files:
      - name: snmp.yaml
        source: managed
        destination: /etc/ktranslate/snmp.yaml
        format: yaml
        mode: "0644"
        read_only: true
        content: "{{ anro_ktranslate_molecule_discovery_snmp_config }}"

  # No type is intentional: this validates the global -> instance normalization
  # path without selecting any reusable profile defaults.
  - name: ktranslate-untyped-molecule
    enabled: false
    command:
      - "-format=prometheus"
      - "-sinks=prometheus"
      - "-prom_listen=:8082"


  # Explicit null follows the same no-profile path as an omitted type.
  - name: ktranslate-null-type-molecule
    type: null
    enabled: false
    command:
      - "-format=prometheus"
      - "-sinks=prometheus"
      - "-prom_listen=:8082"
