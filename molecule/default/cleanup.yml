---
- name: FIXTURES | Remove controller Docker peers
  hosts: ktranslate-rocky9
  become: false
  gather_facts: false
  tasks:
    # No managed-host connection is needed, even if Docker has removed Rocky.
    - name: FIXTURES | Clean up controller resources
      delegate_to: localhost
      block:
        - name: FIXTURES | Remove supporting containers
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop:
            - snmp-router01
            - snmp-router02
            - ktranslate-fixture-http

        - name: FIXTURES | Inspect dedicated outer network
          community.docker.docker_network_info:
            name: ktranslate-molecule
          register: anro_ktranslate_test_cleanup_network

        - name: FIXTURES | Assert no unrelated containers use the network
          ansible.builtin.assert:
            that:
              - >-
                (anro_ktranslate_test_cleanup_network.network.Containers | default({}, true)
                | dict2items | map(attribute='value.Name') | list
                | difference(['ktranslate-rocky9'])) | length == 0
          when: anro_ktranslate_test_cleanup_network.exists

        - name: FIXTURES | Remove dedicated outer network
          community.docker.docker_network:
            name: ktranslate-molecule
            state: absent
            force: true
