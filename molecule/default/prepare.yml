---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install mock Docker executable
      ansible.builtin.copy:
        dest: /usr/local/bin/mock-docker
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          set -eu
          action="${1:-}"
          case "${action}" in
            run)
              trap 'exit 0' TERM INT
              while true; do
                sleep 1
              done
              ;;
            rm|stop)
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac

    - name: Create mock Docker systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Mock Docker Service

          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable mock Docker systemd service
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: started
        daemon_reload: true
