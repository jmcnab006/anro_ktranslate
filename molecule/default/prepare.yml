---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # The target intentionally runs a real nested Docker daemon. This validates
    # the actual systemd -> Docker lifecycle instead of a mock CLI contract.
    - name: PREPARE | Install Docker runtime
      ansible.builtin.apt:
        name:
          - ca-certificates
          - docker.io
        state: present
        update_cache: true

    # vfs trades performance for compatibility in privileged Docker-in-Docker
    # and avoids depending on the outer host's storage driver capabilities.
    - name: PREPARE | Create Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: PREPARE | Configure nested Docker storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "storage-driver": "vfs"
          }
      register: anro_ktranslate_molecule_docker_config

    - name: PREPARE | Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: >-
          {{
            'restarted'
            if anro_ktranslate_molecule_docker_config.changed
            else 'started'
          }}
        daemon_reload: true

    - name: PREPARE | Wait for nested Docker daemon
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - info
      register: anro_ktranslate_molecule_docker_info
      changed_when: false
      retries: 10
      delay: 2
      until: anro_ktranslate_molecule_docker_info.rc == 0

    # Use Ubuntu throughout the lifecycle test so the nested workload matches
    # the operating-system family used for this role's primary deployment target.
    - name: PREPARE | Pull Ubuntu workload image
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - pull
          - ubuntu:24.04
      register: anro_ktranslate_molecule_image_pull
      changed_when: >-
        'Downloaded newer image' in anro_ktranslate_molecule_image_pull.stdout

    # This file simulates configuration owned by a future API/Git/NetBox renderer.
    # The ktranslate role must mount it without taking ownership of its contents.
    - name: PREPARE | Create externally managed test configuration
      ansible.builtin.copy:
        dest: /var/lib/ktranslate-external.conf
        owner: root
        group: root
        mode: "0640"
        content: |
          ownership=external
          scenario=molecule
