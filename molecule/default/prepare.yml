- name: Prepare HTTP configuration fixture
  hosts: ktranslate-config-web
  become: true
  gather_facts: false
  vars_files:
    - vars/main.yaml

  tasks:
    - name: PREPARE | Create HTTP fixture directory
      ansible.builtin.file:
        path: /srv/ktranslate-config
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Render the shared Molecule device data on the external web peer so the
    # HTTP fixture and role tests use one source of truth.
    - name: PREPARE | Render HTTP device configuration fixture
      ansible.builtin.copy:
        dest: /srv/ktranslate-config/snmp.yaml
        owner: root
        group: root
        mode: "0644"
        content: "{{ anro_ktranslate_snmp_config | to_nice_yaml(indent=2, sort_keys=false) }}"

    # Render the shared Molecule device data on the external web peer so the
    # HTTP fixture and role tests use one source of truth.
    - name: PREPARE | Render HTTP device configuration fixture
      ansible.builtin.copy:
        dest: /srv/ktranslate-config/devices.json
        owner: root
        group: root
        mode: "0644"
        content: "{{ molecule_anro_ktranslate_devices | to_nice_json(indent=2) }}"

    - name: PREPARE | Check HTTP fixture server
      ansible.builtin.command:
        argv:
          - /usr/bin/pgrep
          - -f
          - "python3 -m http.server 8080 --bind 0.0.0.0 --directory /srv/ktranslate-config"
      register: anro_ktranslate_molecule_web_process
      changed_when: false
      failed_when: anro_ktranslate_molecule_web_process.rc not in [0, 1]

    # Python is already present in the Ansible-capable Molecule image. Running
    # its static HTTP server keeps the fixture peer minimal and directly visible
    # as a top-level Molecule container.
    - name: PREPARE | Start HTTP fixture server
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - http.server
          - "8080"
          - --bind
          - 0.0.0.0
          - --directory
          - /srv/ktranslate-config
      async: 31536000
      poll: 0
      changed_when: true
      when: anro_ktranslate_molecule_web_process.rc == 1

    - name: PREPARE | Wait for HTTP device configuration fixture
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/snmp.yaml
        return_content: true
        status_code: 200
      register: anro_ktranslate_molecule_web_ready
      retries: 15
      delay: 2
      until: anro_ktranslate_molecule_web_ready.status == 200
