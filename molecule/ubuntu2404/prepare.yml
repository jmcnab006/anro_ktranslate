---
# Podman installation is intentionally exercised during role convergence.
# Docker is used only by the Molecule driver on the controller.
- name: PREPARE | Verify managed host is reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: PREPARE | Verify Ansible connectivity
      ansible.builtin.ping:

    - name: PREPARE | Install Ubuntu repository management tools
      ansible.builtin.apt:
        name:
          - software-properties-common
          - ca-certificates
        state: present
        update_cache: true
      become: true

    - name: PREPARE | Enable Ubuntu universe repository
      ansible.builtin.command:
        argv:
          - add-apt-repository
          - --yes
          - universe
      register: anro_ktranslate_universe_repository
      changed_when: >-
        'Adding component(s)' in
        anro_ktranslate_universe_repository.stdout
      become: true

    - name: PREPARE | Refresh Ubuntu package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true