---
- name: Verify strict security rejects unsafe instance declarations
  hosts: ktranslate-ubuntu-2204
  become: true
  tasks:
    - name: Exercise security validation
      block:
        - name: Validate unsafe configuration
          ansible.builtin.include_role:
            name: anro_ktranslate
          vars:
            anro_ktranslate_security_strict: true
            anro_ktranslate_instances:
              - name: ktranslate-insecure
                enabled: true
                image: kentik/ktranslate:latest
                volumes:
                  - source: /var/run/podman.sock
                    target: /var/run/podman.sock
                    read_only: false
        - name: Fail if security validation accepted unsafe configuration
          ansible.builtin.fail:
            msg: Strict security accepted an unsafe instance
      rescue:
        - name: Confirm failure occurred in security validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task is defined
              - ansible_failed_result is defined
              - ansible_failed_result.msg is defined
              - ansible_failed_task.name == 'VALIDATE EFFECTIVE INSTANCE | Enforce opt-in container security policy'
              - ansible_failed_result.assertion is defined
              - "'@sha256:' in ansible_failed_result.assertion"
              - ansible_failed_result.evaluated_to is defined
              - not (ansible_failed_result.evaluated_to | bool)
              - "'Strict security requires a digest-pinned image' in ansible_failed_result.msg"
            fail_msg: >-
              Unexpected failure during strict security test:
              {{ ansible_failed_result.msg | default('Unknown failure') }}
