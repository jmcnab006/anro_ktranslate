---
- name: SECURITY PREPARE| Prepare Rocky Linux 9 for KTranslate testing
  hosts: ktranslate-rocky9
  become: false
  gather_facts: true

  tasks:
    - name: SECURITY PREPARE| Install DNF repository management tools
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - ca-certificates
        state: present

    - name: SECURITY PREPARE | Configure official Docker CE repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/centos/9/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        state: present

    - name: SECURITY PREPARE | Install Docker Engine
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: SECURITY PREPARE | Start and enable Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: SECURITY PREPARE | Verify Docker daemon
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - info
      register: anro_ktranslate_molecule_docker_info
      changed_when: false
      retries: 5
      delay: 3
      until: anro_ktranslate_molecule_docker_info.rc == 0