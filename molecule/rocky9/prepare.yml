---
- name: PREPARE | Install Podman inside Docker-provisioned Rocky Linux 9 host
  hosts: ktranslate-rocky9
  become: false
  tasks:
    # The Molecule driver remains Docker on the controller. No nested dockerd.
    - name: PREPARE | Install Podman and container networking
      ansible.builtin.dnf:
        name:
          - podman
          - containernetworking-plugins
          - ca-certificates
        state: present
        update_cache: true

    - name: PREPARE | Verify Podman CLI
      ansible.builtin.command:
        argv:
          - /usr/bin/podman
          - --version
      register: anro_ktranslate_molecule_podman_version
      changed_when: false
      failed_when: anro_ktranslate_molecule_podman_version.rc != 0
