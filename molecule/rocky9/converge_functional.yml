---
- name: FIXTURES | Start Docker peers on the controller
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: FIXTURES | Create dedicated outer Docker network
      community.docker.docker_network:
        name: ktranslate-molecule
        ipam_config:
          - subnet: 172.29.0.0/24
        connected:
          - ktranslate-rocky9
        appends: true
        state: present

    - name: FIXTURES | Start SNMP simulator peers
      community.docker.docker_container:
        name: "snmp-{{ item.router }}"
        image: docker.io/tandrup/snmpsim:latest
        entrypoint: [/usr/local/bin/snmpsimd.py]
        command:
          - --data-dir=/snmprec
          - --agent-udpv4-endpoint=0.0.0.0:161
          - --process-user=nobody
          - --process-group=nogroup
        command_handling: correct
        volumes:
          - "{{ playbook_dir }}/files/{{ item.router }}:/snmprec:ro"
        networks:
          - name: ktranslate-molecule
            ipv4_address: "{{ item.ip }}"
        networks_cli_compatible: true
        state: started
      loop:
        - {router: router01, ip: 172.29.0.21}
        - {router: router02, ip: 172.29.0.22}

    - name: FIXTURES | Start HTTP inventory peer
      community.docker.docker_container:
        name: ktranslate-fixture-http
        image: docker.io/library/python:3.12-alpine
        command: [python, -m, http.server, '8080', --bind, 0.0.0.0, --directory, /srv]
        command_handling: correct
        volumes:
          - "{{ playbook_dir }}/files/devices.yaml:/srv/devices.yaml:ro"
        networks:
          - name: ktranslate-molecule
            ipv4_address: 172.29.0.20
        networks_cli_compatible: true
        state: started

- name: FIXTURES | Verify managed host can reach Docker peers
  hosts: ktranslate-rocky9
  become: true
  gather_facts: false
  vars:
    anro_ktranslate_test_peers:
      - {router: router01, ip: 172.29.0.21}
      - {router: router02, ip: 172.29.0.22}
  tasks:
    - name: FIXTURES | Wait for real SNMP responses
      ansible.builtin.command:
        argv: [snmpget, -v2c, -c, public, -t, '2', -r, '0', '{{ item.ip }}', .1.3.6.1.2.1.1.5.0]
      loop: "{{ anro_ktranslate_test_peers }}"
      register: anro_ktranslate_test_snmp
      changed_when: false
      until: anro_ktranslate_test_snmp.rc == 0 and item.router in anro_ktranslate_test_snmp.stdout
      retries: 30
      delay: 2

    - name: FIXTURES | Wait for HTTP inventory
      ansible.builtin.uri:
        url: http://172.29.0.20:8080/devices.yaml
        use_proxy: false
        return_content: true
      register: anro_ktranslate_test_http
      until: anro_ktranslate_test_http.status | default(0) == 200
      retries: 30
      delay: 2

- name: FUNCTIONAL | Deploy polling and discovery workloads
  hosts: ktranslate-rocky9
  become: true
  gather_facts: true
  vars:
    anro_ktranslate_runtime_uid: 1000
    anro_ktranslate_runtime_gid: 1000
    anro_ktranslate_reconcile: false
    anro_ktranslate_image: >-
      {{ lookup('ansible.builtin.env', 'ANRO_KTRANSLATE_TEST_IMAGE')
         | default('docker.io/kentik/ktranslate:latest', true) }}
    anro_ktranslate_instances:
      - name: ktranslate-polling-ansible
        type: polling
        enabled: true
        ports: ['0.0.0.0:18082:8082/tcp']
        config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/devices.yaml') | from_yaml }}"
      - name: ktranslate-polling-url
        type: polling
        enabled: true
        ports: ['0.0.0.0:18083:8082/tcp']
        url: http://172.29.0.20:8080/devices.yaml
        config:
          global:
            poll_time_sec: 30
      - name: ktranslate-discovery-molecule
        type: discovery
        enabled: true
        lifecycle:
          timeout_start_sec: 180
        config:
          discovery:
            cidrs: [172.29.0.21/32, 172.29.0.22/32]
            ports: [161]
            default_communities: [public]
            add_devices: true
            add_mibs: true
            threads: 4
  roles:
    - role: anro_ktranslate
