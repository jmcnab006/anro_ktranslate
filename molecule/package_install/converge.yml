---
- name: Converge package installation scenario
  hosts: all
  become: true
  vars:
    anro_ktranslate_install_method: package_url
    anro_ktranslate_package_url: file:///tmp/ktranslate-mock.deb
    anro_ktranslate_package_checksum: ""
    anro_ktranslate_enable_net_raw: false
    anro_ktranslate_prometheus_listen: "0.0.0.0:8082"
    anro_ktranslate_validate_host: 127.0.0.1
    anro_ktranslate_snmp_config:
      devices: {}
      trap:
        listen: 127.0.0.1:1620
        community: molecule
        version: ""
        transport: ""
      discovery:
        cidrs: []
        ignore_list: []
        debug: false
        ports: [161]
        default_communities: []
        default_v3: null
        add_devices: true
        add_mibs: true
        threads: 1
        replace_devices: true
        check_all_ips: false
        use_snmp_v1: false
      global:
        poll_time_sec: 60
        drop_if_outside_poll: false
        mib_profile_dir: /etc/ktranslate/profiles
        mibs_db: /etc/ktranslate/mibs.db
        mibs_enabled: [IF-MIB]
        timeout_ms: 1000
        retries: 0
        global_v3: null
        response_time: false
        ping_interval_sec: 60
        jitter_time_sec: 0
        fast_poll: false
        watch_profile_changes: false
  roles:
    - role: anro_ktranslate
