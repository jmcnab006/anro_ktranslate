---
- name: Build mock ktranslate Debian package
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install package-build prerequisites
      ansible.builtin.apt:
        name:
          - dpkg-dev
          - python3
          - python3-yaml
          - curl
        state: present
        update_cache: true

    - name: Create package tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/ktranslate-mock/DEBIAN
        - /tmp/ktranslate-mock/usr/bin

    - name: Write package control file
      ansible.builtin.copy:
        dest: /tmp/ktranslate-mock/DEBIAN/control
        mode: "0644"
        content: |
          Package: ktranslate-mock
          Version: 2.2.37
          Section: admin
          Priority: optional
          Architecture: all
          Depends: python3, python3-yaml
          Maintainer: Molecule <molecule@example.invalid>
          Description: Mock ktranslate package for Molecule role testing

    - name: Add mock binary to package
      ansible.builtin.copy:
        src: ../shared/mock_ktranslate.py
        dest: /tmp/ktranslate-mock/usr/bin/ktranslate
        mode: "0755"

    - name: Build mock Debian package
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --build
          - /tmp/ktranslate-mock
          - /tmp/ktranslate-mock.deb
      changed_when: true
