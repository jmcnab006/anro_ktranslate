---
anro_ktranslate_enabled: true
anro_ktranslate_install_method: package_url
anro_ktranslate_package_url: "https://repo.example.net/monitoring/ktranslate_2.2.37_amd64.deb"
anro_ktranslate_package_checksum: "sha256:REPLACE_ME"

# Disable discovery initially and explicitly list only approved networks later.
anro_ktranslate_snmp_config:
  devices: {}
  trap:
    listen: "127.0.0.1:1620"
    community: "{{ vault_ktranslate_trap_community }}"
    version: ""
    transport: ""
  discovery:
    cidrs:
      - "10.20.0.0/24"
    ignore_list:
      - "10.20.0.1/32"
    debug: false
    ports:
      - 161
    default_communities:
      - "{{ vault_snmp_v2_community }}"
    default_v3: null
    add_devices: true
    add_mibs: true
    threads: 8
    replace_devices: true
    check_all_ips: false
    use_snmp_v1: false
  global:
    poll_time_sec: 60
    drop_if_outside_poll: false
    mib_profile_dir: "/etc/ktranslate/profiles"
    mibs_db: "/etc/ktranslate/mibs.db"
    mibs_enabled:
      - "IF-MIB"
    timeout_ms: 5000
    retries: 1
    global_v3: null
    response_time: true
    ping_interval_sec: 60
    jitter_time_sec: 10
    fast_poll: false
    watch_profile_changes: false
