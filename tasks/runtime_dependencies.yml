---
# Use distribution packages rather than upstream installation scripts. DNF/APT
# resolve OCI runtime, conmon, network and storage dependencies for the host.
- name: RUNTIME | Install Podman and required host packages
  ansible.builtin.package:
    name: "{{ anro_ktranslate_podman_packages }}"
    state: present
  become: true

# Podman is daemonless. Do not enable podman.service or podman.socket: ktranslate
# systemd units invoke the Podman CLI directly, without an API socket.
# Validate the configured executable after the package-installation phase.
# This catches unsupported custom binary paths before systemd units are written.
- name: VALIDATE | Inspect configured Podman CLI
  ansible.builtin.stat:
    path: "{{ anro_ktranslate_podman_binary }}"
  register: anro_ktranslate_podman_binary_stat

- name: VALIDATE | Assert Podman CLI is executable
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - anro_ktranslate_podman_binary_stat.stat.exists
      - anro_ktranslate_podman_binary_stat.stat.isreg
      - anro_ktranslate_podman_binary_stat.stat.executable
    fail_msg: >-
      Podman CLI {{ anro_ktranslate_podman_binary }} is not executable. Check
      anro_ktranslate_podman_binary and the managed host package installation.
