---
- name: VALIDATE | Validate global ktranslate settings
  ansible.builtin.assert:
    that:
      - anro_ktranslate_image is string
      - anro_ktranslate_image | length > 0
      - anro_ktranslate_docker_binary is string
      - anro_ktranslate_docker_binary is match('^/')
      - anro_ktranslate_systemd_dir is string
      - anro_ktranslate_systemd_dir is match('^/')
      - anro_ktranslate_config_dir is string
      - anro_ktranslate_config_dir is match('^/')
      - anro_ktranslate_environment_dir is string
      - anro_ktranslate_environment_dir is match('^/')
      - anro_ktranslate_container_config_dir is string
      - anro_ktranslate_container_config_dir is match('^/')
      - anro_ktranslate_service_prefix is match('^[A-Za-z0-9_.@-]+$')
      - anro_ktranslate_default_pull_policy in ['always', 'missing', 'never']
      - anro_ktranslate_default_restart_sec | int >= 0
      - anro_ktranslate_default_stop_timeout | int > 0
      - anro_ktranslate_polling_instances is sequence
      - anro_ktranslate_polling_instances is not string
      - anro_ktranslate_discovery_instances is sequence
      - anro_ktranslate_discovery_instances is not string
      - anro_ktranslate_trap_instances is sequence
      - anro_ktranslate_trap_instances is not string
    fail_msg: "Invalid global anro_ktranslate role configuration."

- name: VALIDATE | Verify Docker CLI exists
  ansible.builtin.stat:
    path: "{{ anro_ktranslate_docker_binary }}"
  register: anro_ktranslate_docker_binary_stat

- name: VALIDATE | Assert Docker CLI is executable
  ansible.builtin.assert:
    that:
      - anro_ktranslate_docker_binary_stat.stat.exists
      - anro_ktranslate_docker_binary_stat.stat.isreg
      - anro_ktranslate_docker_binary_stat.stat.executable
    fail_msg: >-
      Docker CLI {{ anro_ktranslate_docker_binary }} is not executable. Install
      Docker before applying anro_ktranslate or override anro_ktranslate_docker_binary.

- name: VALIDATE | Validate polling instance definitions
  ansible.builtin.include_tasks: validate_instance.yml
  loop: "{{ anro_ktranslate_polling_instances }}"
  loop_control:
    loop_var: anro_ktranslate_raw_instance
    label: "polling/{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}"
  vars:
    anro_ktranslate_validation_service_type: "polling"

- name: VALIDATE | Validate discovery instance definitions
  ansible.builtin.include_tasks: validate_instance.yml
  loop: "{{ anro_ktranslate_discovery_instances }}"
  loop_control:
    loop_var: anro_ktranslate_raw_instance
    label: "discovery/{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}"
  vars:
    anro_ktranslate_validation_service_type: "discovery"

- name: VALIDATE | Validate trap instance definitions
  ansible.builtin.include_tasks: validate_instance.yml
  loop: "{{ anro_ktranslate_trap_instances }}"
  loop_control:
    loop_var: anro_ktranslate_raw_instance
    label: "traps/{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}"
  vars:
    anro_ktranslate_validation_service_type: "traps"
