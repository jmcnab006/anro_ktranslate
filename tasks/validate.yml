---
# Argument specs provide type validation, while these assertions enforce path,
# naming, and cross-field constraints that argument_specs cannot express cleanly.
- name: VALIDATE | Validate global ktranslate settings
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - anro_ktranslate_image | length > 0
      - anro_ktranslate_snmp_validator_argv is sequence
      - anro_ktranslate_snmp_validator_argv is not string
      - anro_ktranslate_activation_retries | int > 0
      - anro_ktranslate_activation_delay | int >= 0
      - anro_ktranslate_docker_binary is match('^/')
      - anro_ktranslate_systemd_dir is match('^/')
      - anro_ktranslate_config_dir is match('^/')
      - anro_ktranslate_environment_dir is match('^/')
      - anro_ktranslate_service_prefix is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*$')
      - anro_ktranslate_default_network | length > 0
      - anro_ktranslate_default_pull_policy in ['always', 'missing', 'never']
      - anro_ktranslate_default_restart_sec | int >= 0
      - anro_ktranslate_default_stop_timeout | int > 0
      - anro_ktranslate_default_start_limit_interval_sec | int >= 0
      - anro_ktranslate_default_start_limit_burst | int > 0
      - anro_ktranslate_default_command is sequence
      - anro_ktranslate_default_command is not string
      - anro_ktranslate_baseline_config is mapping
      - anro_ktranslate_instance_defaults is mapping
      - anro_ktranslate_profiles is mapping
      - anro_ktranslate_instances is sequence
      - anro_ktranslate_instances is not string
    fail_msg: "Invalid global anro_ktranslate role configuration."

# Docker installation remains deliberately outside this role; fail with a clear
# message instead of allowing generated systemd units to fail later at runtime.
- name: VALIDATE | Inspect configured Docker CLI
  ansible.builtin.stat:
    path: "{{ anro_ktranslate_docker_binary }}"
  register: anro_ktranslate_docker_binary_stat

- name: VALIDATE | Assert Docker CLI is executable
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - anro_ktranslate_docker_binary_stat.stat.exists
      - anro_ktranslate_docker_binary_stat.stat.isreg
      - anro_ktranslate_docker_binary_stat.stat.executable
    fail_msg: >-
      Docker CLI {{ anro_ktranslate_docker_binary }} is not executable. Install
      Docker before applying anro_ktranslate or override anro_ktranslate_docker_binary.

# Validate the default command separately because it is inherited by any
# instance that does not provide an explicit command override.
- name: VALIDATE | Validate default ktranslate command arguments
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - item is string
      - "'\n' not in item"
      - "'\r' not in item"
    fail_msg: "Every anro_ktranslate_default_command argument must be a single-line string."
  loop: "{{ anro_ktranslate_default_command }}"
  loop_control:
    label: "{{ item }}"

# Profiles must be mappings because normalization merges the selected profile
# into the instance definition. A null profile commonly indicates an empty YAML
# key such as "polling:" and cannot be safely normalized.
- name: VALIDATE | Validate ktranslate profile definitions
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - item.key is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - item.value is not none
      - item.value is mapping
    fail_msg: >-
      Invalid ktranslate profile '{{ item.key }}'.
      Each profile must contain a YAML mapping of instance defaults.
      Received {{ item.value | type_debug }} instead.
      Check for an empty profile definition such as '{{ item.key }}:'.
  loop: "{{ anro_ktranslate_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Validate each profile's keyed CLI arguments independently. Keeping this in a
# separate include avoids flattening mappings into opaque list expressions.
- name: VALIDATE | Validate profile ktranslate arguments
  ansible.builtin.include_tasks: validate_profile.yml
  loop: "{{ anro_ktranslate_profiles | dict2items }}"
  loop_control:
    loop_var: anro_ktranslate_profile_entry
    label: "{{ anro_ktranslate_profile_entry.key }}"

# Raw instances are normalized before detailed validation so values inherited
# from profiles receive the same validation as values written on the instance.
- name: VALIDATE | Validate ktranslate instance definitions
  ansible.builtin.include_tasks: validate_effective_instance.yml
  loop: "{{ anro_ktranslate_instances }}"
  loop_control:
    loop_var: anro_ktranslate_raw_instance
    label: >-
      {{ anro_ktranslate_raw_instance.type | default('UNKNOWN') }}/{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}

# Exact instance names are the systemd unit and Docker container basenames, so
# duplicates would cause destructive collisions even if their types differ.
- name: VALIDATE | Assert ktranslate instance names are unique
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - >-
        (anro_ktranslate_instances | map(attribute='name') | list | unique | length)
        ==
        (anro_ktranslate_instances | map(attribute='name') | list | length)
    fail_msg: "Every anro_ktranslate_instances entry must have a unique name."
  when: anro_ktranslate_instances | length > 0

- name: VALIDATE | Validate optional SNMP validator arguments
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
    quiet: true
  loop: "{{ anro_ktranslate_snmp_validator_argv }}"
  no_log: true

- name: VALIDATE | Require runtime ownership for writable instances
  ansible.builtin.assert:
    that:
      - anro_ktranslate_runtime_uid is not none
      - anro_ktranslate_runtime_gid is not none
      - anro_ktranslate_runtime_uid | string is match('^[0-9]+$')
      - anro_ktranslate_runtime_gid | string is match('^[0-9]+$')
    fail_msg: Set anro_ktranslate_runtime_uid and anro_ktranslate_runtime_gid to the image process identity.
  when: >-
    anro_ktranslate_instances | selectattr('discovery_output', 'defined')
    | selectattr('discovery_output', 'equalto', true) | list | length > 0
    or anro_ktranslate_instances | selectattr('runtime_output', 'defined')
    | selectattr('runtime_output', 'equalto', true) | list | length > 0
