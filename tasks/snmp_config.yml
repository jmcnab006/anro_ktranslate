---
# snmp.yaml is a required role-owned artifact for every ktranslate instance.
# Start with the inert baseline, optionally overlay a remote YAML document, then
# overlay instance config. This makes precedence deterministic without a mode flag.
- name: SNMP CONFIG | Initialize effective configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_effective_snmp_config: "{{ anro_ktranslate_baseline_config }}"

# The URL is staged in a hidden file so a failed download or parse cannot replace
# the active snmp.yaml. force=true makes the remote source authoritative on every
# converge; the later managed-file copy still controls idempotent reload behavior.
- name: SNMP CONFIG | Download remote configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.get_url:
    url: "{{ anro_ktranslate_instance.url }}"
    dest: "{{ anro_ktranslate_current_config_dir }}/.snmp-source.yaml"
    owner: root
    group: root
    mode: "0600"
    force: true
    validate_certs: "{{ anro_ktranslate_validate_certs | default(true) | bool }}"
  no_log: true
  when: anro_ktranslate_instance.url is defined

- name: SNMP CONFIG | Read remote configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.slurp:
    src: "{{ anro_ktranslate_current_config_dir }}/.snmp-source.yaml"
  register: anro_ktranslate_remote_snmp_slurp
  no_log: true
  when: anro_ktranslate_instance.url is defined

# JSON is valid YAML. Parse the staged source before touching the active file.
# A malformed document must fail with a controlled message and without leaking
# SNMP communities or other credentials into the Ansible output.
- name: SNMP CONFIG | Validate downloaded configuration for {{ anro_ktranslate_instance.name }}
  when: anro_ktranslate_instance.url is defined
  block:
    - name: SNMP CONFIG | Parse downloaded YAML or JSON for {{ anro_ktranslate_instance.name }}
      ansible.builtin.set_fact:
        anro_ktranslate_remote_snmp_config: >-
          {{ anro_ktranslate_remote_snmp_slurp.content | b64decode | from_yaml }}
      no_log: true

    - name: SNMP CONFIG | Assert downloaded configuration structure for {{ anro_ktranslate_instance.name }}
      ansible.builtin.assert:
        that:
          - anro_ktranslate_remote_snmp_config is mapping
          - anro_ktranslate_remote_snmp_config.devices | default({}) is mapping
          - anro_ktranslate_remote_snmp_config.global | default({}) is mapping
          - >-
            anro_ktranslate_remote_snmp_config.discovery is not defined
            or anro_ktranslate_remote_snmp_config.discovery is none
            or anro_ktranslate_remote_snmp_config.discovery is mapping
          - >-
            anro_ktranslate_remote_snmp_config.trap is not defined
            or anro_ktranslate_remote_snmp_config.trap is none
            or anro_ktranslate_remote_snmp_config.trap is mapping
        fail_msg: Downloaded SNMP configuration has an invalid structure.
      no_log: true
  rescue:
    - name: SNMP CONFIG | Reject invalid downloaded configuration for {{ anro_ktranslate_instance.name }}
      ansible.builtin.fail:
        msg: >-
          Downloaded SNMP configuration for {{ anro_ktranslate_instance.name }}
          is invalid YAML/JSON or has an invalid structure.

# Recursive mapping merge preserves unspecified baseline/remote keys. Lists are
# replaced rather than appended because ktranslate list values are complete policy.
- name: SNMP CONFIG | Merge configuration layers for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_effective_snmp_config: >-
      {{
        anro_ktranslate_baseline_config
        | combine(
            anro_ktranslate_remote_snmp_config
            if anro_ktranslate_instance.url is defined
            else {},
            recursive=true,
            list_merge='replace'
          )
        | combine(
            anro_ktranslate_instance.config | default({}, true),
            recursive=true,
            list_merge='replace'
          )
      }}

# Validate both the merged mapping and its YAML representation before the
# existing managed-file lifecycle can replace the active configuration.
- name: SNMP CONFIG | Validate merged configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.assert:
    that:
      - anro_ktranslate_effective_snmp_config is mapping
      - anro_ktranslate_effective_snmp_config.devices | default({}) is mapping
      - anro_ktranslate_effective_snmp_config.global | default({}) is mapping
      - >-
        anro_ktranslate_effective_snmp_config.discovery is not defined
        or anro_ktranslate_effective_snmp_config.discovery is none
        or anro_ktranslate_effective_snmp_config.discovery is mapping
      - >-
        anro_ktranslate_effective_snmp_config.trap is not defined
        or anro_ktranslate_effective_snmp_config.trap is none
        or anro_ktranslate_effective_snmp_config.trap is mapping
    fail_msg: >-
      Merged SNMP configuration for {{ anro_ktranslate_instance.name }}
      has an invalid structure.
  no_log: true

- name: SNMP CONFIG | Validate YAML serialization for {{ anro_ktranslate_instance.name }}
  ansible.builtin.assert:
    that:
      - >-
        (
          anro_ktranslate_effective_snmp_config
          | to_nice_yaml(indent=2, sort_keys=false)
          | from_yaml
        ) == anro_ktranslate_effective_snmp_config
    fail_msg: >-
      Merged SNMP configuration for {{ anro_ktranslate_instance.name }}
      failed YAML serialization validation.
  no_log: true

# The downloaded YAML device block must retain its original scalar representation:
# a YAML round-trip changes discovery timestamps and has been observed to make
# ktranslate reject the device mapping. Preserve it when devices are not overridden.
# JSON input remains supported through the standard YAML serialization path.
# Preserve the original device block, including timestamp precision and
# scalar formatting, when device definitions are not explicitly overridden.
- name: SNMP CONFIG | Extract original YAML devices block for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_source_devices_block: >-
      {{
        (
          anro_ktranslate_remote_snmp_slurp.content
          | b64decode
          | regex_search('(?m)^devices:[^\r\n]*(?:\r?\n[ \t]+[^\r\n]*)*')
          | default('', true)
        ) | trim
      }}
  no_log: true
  when: anro_ktranslate_instance.url is defined

- name: SNMP CONFIG | Select lossless device rendering for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_preserve_source_devices: >-
      {{
        anro_ktranslate_instance.url is defined
        and (anro_ktranslate_source_devices_block | default('') | length > 0)
        and (
          anro_ktranslate_remote_snmp_config.devices | default({})
          | length > 0
        )
        and (
          (anro_ktranslate_instance.config | default({})).devices
          is not defined
        )
        and (
          anro_ktranslate_baseline_config.devices | default({})
          | length == 0
        )
      }}

# Render all non-device configuration through the normal YAML serializer.
# The downloaded device block is appended separately when preservation is enabled.
- name: SNMP CONFIG | Render configuration without devices for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_rendered_snmp_config: >-
      {{
        (
          anro_ktranslate_effective_snmp_config
          | dict2items
          | rejectattr('key', 'equalto', 'devices')
          | list
          | items2dict
        )
        | to_nice_yaml(indent=2, sort_keys=false)
      }}
  no_log: true
  when: anro_ktranslate_preserve_source_devices | bool

- name: SNMP CONFIG | Append preserved devices for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_rendered_snmp_config: >-
      {{
        [
          anro_ktranslate_rendered_snmp_config | trim,
          anro_ktranslate_source_devices_block | trim
        ] | join('%c' | format(10))
      }}
  no_log: true
  when: anro_ktranslate_preserve_source_devices | bool

- name: SNMP CONFIG | Render complete configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_rendered_snmp_config: >-
      {{
        anro_ktranslate_effective_snmp_config
        | to_nice_yaml(indent=2, sort_keys=false)
      }}
  no_log: true
  when: not (anro_ktranslate_preserve_source_devices | bool)

- name: SNMP CONFIG | Diagnose device preservation for {{ anro_ktranslate_instance.name }}
  ansible.builtin.debug:
    msg:
      instance: "{{ anro_ktranslate_instance.name }}"
      preservation_enabled: "{{ anro_ktranslate_preserve_source_devices | bool }}"
      source_device_count: >-
        {{
          anro_ktranslate_remote_snmp_config.devices
          | default({})
          | length
          if anro_ktranslate_instance.url is defined
          else 0
        }}
      merged_device_count: >-
        {{
          anro_ktranslate_effective_snmp_config.devices
          | default({})
          | length
        }}
      rendered_device_count: >-
        {{
          (anro_ktranslate_rendered_snmp_config | from_yaml).devices
          | default({})
          | length
        }}
      extracted_block_present: >-
        {{
          anro_ktranslate_source_devices_block
          | default('')
          | length > 0
        }}

- name: SNMP CONFIG | Diagnose rendered device section for {{ anro_ktranslate_instance.name }}
  ansible.builtin.debug:
    msg:
      preservation_enabled: "{{ anro_ktranslate_preserve_source_devices | bool }}"
      extracted_starts_with_devices: >-
        {{
          anro_ktranslate_source_devices_block
          | default('')
          | regex_search('(?m)^devices:')
          is not none
        }}
      rendered_starts_with_devices: >-
        {{
          anro_ktranslate_rendered_snmp_config
          | regex_search('(?m)^devices:')
          is not none
        }}
      extracted_device_count: >-
        {{
          (
            anro_ktranslate_source_devices_block
            | from_yaml
          ).devices | default({}) | length
        }}
      rendered_device_count: >-
        {{
          (
            anro_ktranslate_rendered_snmp_config
            | from_yaml
          ).devices | default({}) | length
        }}

- name: SNMP CONFIG | Validate rendered YAML for {{ anro_ktranslate_instance.name }}
  ansible.builtin.assert:
    that:
      - anro_ktranslate_rendered_snmp_config | from_yaml is mapping
      - >-
        (
          (
            (anro_ktranslate_rendered_snmp_config | from_yaml).devices
            | default({})
          ) | length
        ) == (
          (
            anro_ktranslate_effective_snmp_config.devices
            | default({})
          ) | length
        )
    fail_msg: >-
      Final rendered SNMP configuration is invalid or lost devices
      for {{ anro_ktranslate_instance.name }}.
  no_log: true

# Reuse the existing managed-file lifecycle so snmp.yaml gets the same mount,
# restart, live-signal, and stopped-container behavior as other managed files.
# ktranslate runs as a non-root UID. The active bind-mounted
# configuration must therefore be world-readable; the staged
# remote source remains root-only at 0600.
- name: SNMP CONFIG | Register effective configuration for {{ anro_ktranslate_instance.name }}
  ansible.builtin.set_fact:
    anro_ktranslate_instance: >-
      {{
        anro_ktranslate_instance
        | combine(
            {
              'files': (anro_ktranslate_instance.files | default([], true)) + [
                {
                  'name': 'snmp.yaml',
                  'source': 'managed',
                  'destination': '/etc/ktranslate/snmp.yaml',
                  'format': 'raw',
                  'mode': '0644',
                  'read_only': true,
                  'no_log': true,
                  'reload': anro_ktranslate_instance.reload | default('signal'),
                  'reload_signal': anro_ktranslate_instance.reload_signal | default('USR2'),
                  'content': anro_ktranslate_rendered_snmp_config
                }
              ]
            },
            recursive=false
          )
      }}
