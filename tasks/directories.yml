---
# The root configuration directory may contain non-secret metadata and therefore
# remains traversable; individual managed files receive explicit restrictive modes.
- name: DIRECTORIES | Create ktranslate configuration directory
  ansible.builtin.file:
    path: "{{ anro_ktranslate_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Environment files can contain credentials, so the directory is root-only in
# addition to each file being written with mode 0600.
- name: DIRECTORIES | Create ktranslate environment directory
  ansible.builtin.file:
    path: "{{ anro_ktranslate_environment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
