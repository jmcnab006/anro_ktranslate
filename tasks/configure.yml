---
- name: Create ktranslate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ anro_ktranslate_user }}"
    group: "{{ anro_ktranslate_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ anro_ktranslate_config_dir }}", mode: "0750" }
    - { path: "{{ anro_ktranslate_profiles_dir }}", mode: "0750" }
    - { path: "{{ anro_ktranslate_mibs_db_dir }}", mode: "0750" }
  become: true

- name: Render ktranslate SNMP configuration
  ansible.builtin.template:
    src: snmp.yaml.j2
    dest: "{{ anro_ktranslate_snmp_config_path }}"
    owner: "{{ anro_ktranslate_user }}"
    group: "{{ anro_ktranslate_group }}"
    mode: "0640"
  become: true
  notify: Restart ktranslate

- name: Render ktranslate environment file
  ansible.builtin.template:
    src: ktranslate.env.j2
    dest: "{{ anro_ktranslate_environment_path }}"
    owner: root
    group: "{{ anro_ktranslate_group }}"
    mode: "0640"
  become: true
  notify: Restart ktranslate

- name: Install ktranslate systemd unit
  ansible.builtin.template:
    src: ktranslate.service.j2
    dest: /etc/systemd/system/ktranslate.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart ktranslate

- name: Enable and start ktranslate
  ansible.builtin.systemd:
    name: ktranslate
    enabled: true
    state: started
    daemon_reload: true
  become: true
