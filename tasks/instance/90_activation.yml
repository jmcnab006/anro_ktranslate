---
- name: INSTANCE | Activate configuration with rollback on failure
  block:
    # Timers own scheduled starts; a completed one-shot is not expected to
    # leave a running container for Podman inspect.
    - name: INSTANCE | Manage persistent service state
      ansible.builtin.systemd_service:
        name: "{{ anro_ktranslate_instance.name }}.service"
        enabled: "{{ anro_ktranslate_instance.enabled | bool }}"
        daemon_reload: "{{ anro_ktranslate_unit_template.changed or (anro_ktranslate_removed_timer.changed | default(false)) }}"
        state: >-
          {{ 'restarted' if (anro_ktranslate_instance.enabled | bool and anro_ktranslate_instance_restart_required)
             else ('started' if anro_ktranslate_instance.enabled | bool else 'stopped') }}
      when: (anro_ktranslate_instance.lifecycle.mode | default('persistent')) == 'persistent'

    - name: INSTANCE | Disable finite discovery service on lifecycle transition
      ansible.builtin.systemd_service:
        name: "{{ anro_ktranslate_instance.name }}.service"
        enabled: false
        daemon_reload: true
      when:
        - (anro_ktranslate_instance.lifecycle.mode | default('persistent')) != 'persistent'
        - anro_ktranslate_unit_template.changed | bool

    - name: INSTANCE | Manage scheduled discovery timer
      ansible.builtin.systemd_service:
        name: "{{ anro_ktranslate_instance.name }}.timer"
        enabled: "{{ anro_ktranslate_instance.enabled | bool }}"
        state: "{{ 'started' if anro_ktranslate_instance.enabled | bool else 'stopped' }}"
        daemon_reload: >-
          {{
            anro_ktranslate_timer_template.changed | default(false)
            or anro_ktranslate_unit_template.changed | default(false)
          }}
      when:
        - (anro_ktranslate_instance.lifecycle.mode | default('persistent')) == 'timer'

    # Manual one-shot jobs are intentionally not launched by every converge.
    # Operators run them with systemctl start after deployment.
    - name: INSTANCE | Verify persistent container is running after activation
      ansible.builtin.command:
        argv:
          - "{{ anro_ktranslate_podman_binary }}"
          - inspect
          - --format
          - "{{ '{{.State.Running}}' }}"
          - "{{ anro_ktranslate_instance.name }}"
      register: anro_ktranslate_activation_state
      changed_when: false
      until: anro_ktranslate_activation_state.rc == 0 and anro_ktranslate_activation_state.stdout | trim == 'true'
      retries: "{{ anro_ktranslate_activation_retries }}"
      delay: "{{ anro_ktranslate_activation_delay }}"
      when:
        - anro_ktranslate_instance.enabled | bool
        - (anro_ktranslate_instance.lifecycle.mode | default('persistent')) == 'persistent'
  rescue:
    - name: INSTANCE | Restore previous SNMP configuration after activation failure
      ansible.builtin.copy:
        src: "{{ anro_ktranslate_current_config_dir }}/.snmp-rollback.yaml"
        dest: "{{ anro_ktranslate_current_config_dir }}/snmp.yaml"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: anro_ktranslate_previous_snmp_stat.stat.exists
      no_log: true

    - name: INSTANCE | Restart service with restored configuration
      ansible.builtin.systemd_service:
        name: "{{ anro_ktranslate_instance.name }}.service"
        state: restarted
      when:
        - anro_ktranslate_previous_snmp_stat.stat.exists
        - anro_ktranslate_instance.enabled | bool
        - (anro_ktranslate_instance.lifecycle.mode | default('persistent')) == 'persistent'

    - name: INSTANCE | Fail deployment after rollback
      ansible.builtin.fail:
        msg: "Activation failed for {{ anro_ktranslate_instance.name }}; previous SNMP configuration restored when available."

# Collect signals required by changed managed files. ktranslate's supported SNMP
# device reload uses USR2, while reload_signal remains configurable for future
# workloads that expose a different signal-based reload contract.
