---
# Search only the configured prefix. The embedded marker below prevents removal
# of similarly named units that were not created by this role.
- name: RECONCILE | Find candidate ktranslate systemd units
  ansible.builtin.find:
    paths: "{{ anro_ktranslate_systemd_dir }}"
    patterns: "{{ anro_ktranslate_service_prefix }}-*.service"
    file_type: file
    recurse: false
  register: anro_ktranslate_existing_units

- name: RECONCILE | Inspect candidate ktranslate systemd units
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ anro_ktranslate_existing_units.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: anro_ktranslate_existing_unit_contents

- name: RECONCILE | Initialize stale service list
  ansible.builtin.set_fact:
    anro_ktranslate_stale_services: []

# Only a unit containing the role marker and absent from desired instance names
# is considered stale. This is the safety boundary for destructive cleanup.
- name: RECONCILE | Identify stale role-managed services
  ansible.builtin.set_fact:
    anro_ktranslate_stale_services: >-
      {{
        anro_ktranslate_stale_services
        + [item.item.path | basename | regex_replace('\\.service$', '')]
      }}
  loop: "{{ anro_ktranslate_existing_unit_contents.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - anro_ktranslate_managed_marker in (item.content | b64decode)
    - >-
      (item.item.path | basename | regex_replace('\\.service$', ''))
      not in (anro_ktranslate_instances | map(attribute='name') | list)

- name: RECONCILE | Stop and disable stale services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: stopped
    enabled: false
  loop: "{{ anro_ktranslate_stale_services }}"
  loop_control:
    label: "{{ item }}"

# docker rm returns non-zero for an already absent container. Treat that specific
# state as converged while preserving unexpected Docker failures.
- name: RECONCILE | Remove stale containers
  ansible.builtin.command:
    argv:
      - "{{ anro_ktranslate_docker_binary }}"
      - rm
      - --force
      - "{{ item }}"
  loop: "{{ anro_ktranslate_stale_services }}"
  loop_control:
    label: "{{ item }}"
  register: anro_ktranslate_stale_container_remove
  changed_when: anro_ktranslate_stale_container_remove.rc == 0
  failed_when:
    - anro_ktranslate_stale_container_remove.rc != 0
    - "'No such container' not in anro_ktranslate_stale_container_remove.stderr"

- name: RECONCILE | Remove stale systemd unit files
  ansible.builtin.file:
    path: "{{ anro_ktranslate_systemd_dir }}/{{ item }}.service"
    state: absent
  loop: "{{ anro_ktranslate_stale_services }}"
  loop_control:
    label: "{{ item }}"
  notify: Reload systemd daemon

- name: RECONCILE | Remove stale managed configuration directories
  ansible.builtin.file:
    path: "{{ anro_ktranslate_config_dir }}/{{ item }}"
    state: absent
  loop: "{{ anro_ktranslate_stale_services }}"
  loop_control:
    label: "{{ item }}"

- name: RECONCILE | Remove stale environment files
  ansible.builtin.file:
    path: "{{ anro_ktranslate_environment_dir }}/{{ item }}.env"
    state: absent
  loop: "{{ anro_ktranslate_stale_services }}"
  loop_control:
    label: "{{ item }}"
