---
# Type is optional. When supplied with a non-empty value it is authoritative and
# must select a same-named profile. Omitted, null, and empty values intentionally
# use only global instance defaults plus explicit instance configuration.
- name: VALIDATE EFFECTIVE INSTANCE | Validate selected type for {{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - >-
        not (anro_ktranslate_raw_instance.type | default(None, true))
        or anro_ktranslate_raw_instance.type in anro_ktranslate_profiles
    fail_msg: >-
      Instance '{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}'
      selects unknown type '{{ anro_ktranslate_raw_instance.type | default('UNDEFINED') }}'.
      Non-empty types must match a key in anro_ktranslate_profiles.

# Build the same effective mapping used during configuration. Dictionaries merge
# recursively while lists and scalars from later layers replace earlier values.
# No profile-to-profile inheritance is performed. files is always normalized to
# a list and optional type to null so validation and configuration evaluate the
# same structural contract consumed later by tasks and templates.
- name: VALIDATE EFFECTIVE INSTANCE | Normalize {{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}
  ansible.builtin.set_fact:
    anro_ktranslate_validation_instance: >-
      {{
        {'files': []}
        | combine(anro_ktranslate_instance_defaults, recursive=true, list_merge='replace')
        | combine(
            anro_ktranslate_profiles[anro_ktranslate_raw_instance.type]
            if (anro_ktranslate_raw_instance.type | default(None, true))
            else {},
            recursive=true,
            list_merge='replace'
          )
        | combine(anro_ktranslate_raw_instance, recursive=true, list_merge='replace')
        | combine(
            {'type': anro_ktranslate_raw_instance.type | default(None, true)},
            recursive=false
          )
      }}

# A raw command and keyed arguments represent two different configuration modes.
# Rejecting their combination avoids hidden precedence and makes the generated
# Docker command straightforward to diagnose from inventory.
- name: VALIDATE EFFECTIVE INSTANCE | Validate CLI configuration mode for {{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}
  ansible.builtin.assert:
    quiet: "{{ not (anro_ktranslate_debug | bool) }}"
    that:
      - >-
        not (
          anro_ktranslate_validation_instance.command is defined
          and anro_ktranslate_validation_instance.ktranslate_args is defined
          and anro_ktranslate_validation_instance.ktranslate_args | length > 0
        )
    fail_msg: >-
      Instance '{{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}'
      resolves both command and ktranslate_args. Use keyed ktranslate_args for
      mergeable configuration or command as the raw escape hatch, but not both.

# Reuse the complete instance validator against normalized data so inherited
# type-profile/default values receive exactly the same path, port, file, and runtime
# checks as values declared directly on an instance.
- name: VALIDATE EFFECTIVE INSTANCE | Validate normalized instance {{ anro_ktranslate_raw_instance.name | default('UNNAMED') }}
  ansible.builtin.include_tasks: validate_instance.yml
  vars:
    anro_ktranslate_raw_instance: "{{ anro_ktranslate_validation_instance }}"
