---
# Validate before changing host state so malformed instance definitions fail
# early and do not leave a partially configured service stack.
- name: MAIN | Validate ktranslate role configuration
  ansible.builtin.import_tasks: validate.yml

- name: MAIN | Prepare ktranslate host directories
  ansible.builtin.import_tasks: directories.yml

# Reconciliation is performed before desired instances are configured so stale
# services cannot retain ports or host-network listeners needed by new units.
- name: MAIN | Reconcile removed ktranslate instances
  ansible.builtin.import_tasks: reconcile.yml
  when: anro_ktranslate_reconcile | bool

# Normalize each raw declaration before lifecycle processing. A profile is used
# only when the instance explicitly selects it; workload type remains metadata.
- name: MAIN | Normalize and configure desired ktranslate instances
  ansible.builtin.include_tasks: configure_instance.yml
  loop: "{{ anro_ktranslate_instances }}"
  loop_control:
    loop_var: anro_ktranslate_raw_instance
    label: "{{ anro_ktranslate_raw_instance.type }}/{{ anro_ktranslate_raw_instance.name }}"
