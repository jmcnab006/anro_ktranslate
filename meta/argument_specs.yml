---
argument_specs:
  main:
    short_description: Manage multiple ktranslate Docker containers as systemd services.
    description:
      - >-
        Deploys a desired stack of independent ktranslate containers without
        encoding ktranslate input, format, or sink semantics into the role.
      - >-
        Prometheus is the default command behavior, but every instance can
        replace the command completely.
      - >-
        Configuration files can be rendered from static inventory data or
        mounted from externally managed host paths.
    options:
      anro_ktranslate_image:
        type: str
        default: "kentik/ktranslate:latest"
        description:
          - Default Docker image used when an instance does not set image.
          - Pin an explicit version or digest in production.

      anro_ktranslate_docker_binary:
        type: path
        default: "/usr/bin/docker"
        description:
          - Absolute path to the Docker CLI.
          - Docker installation is intentionally outside this role.

      anro_ktranslate_systemd_dir:
        type: path
        default: "/etc/systemd/system"
        description:
          - Directory where role-managed systemd units are written.

      anro_ktranslate_config_dir:
        type: path
        default: "/etc/ktranslate"
        description:
          - Root host directory for role-managed per-instance files.

      anro_ktranslate_environment_dir:
        type: path
        default: "/etc/ktranslate/environment"
        description:
          - Root-only directory for generated Docker environment files.

      anro_ktranslate_service_prefix:
        type: str
        default: "ktranslate"
        description:
          - Prefix required on instance names and used to scope reconciliation.

      anro_ktranslate_default_network:
        type: str
        default: "bridge"
        description:
          - Default Docker network mode for instances.

      anro_ktranslate_default_pull_policy:
        type: str
        default: "missing"
        choices:
          - always
          - missing
          - never
        description:
          - Default value passed to Docker run --pull.

      anro_ktranslate_default_restart_sec:
        type: int
        default: 5
        description:
          - Default systemd restart delay in seconds.

      anro_ktranslate_default_stop_timeout:
        type: int
        default: 30
        description:
          - Default Docker stop timeout in seconds.

      anro_ktranslate_default_start_limit_interval_sec:
        type: int
        default: 60
        description:
          - Default systemd start-rate-limit interval in seconds.

      anro_ktranslate_default_start_limit_burst:
        type: int
        default: 5
        description:
          - Default number of starts allowed inside the rate-limit interval.

      anro_ktranslate_default_command:
        type: list
        elements: str
        default:
          - "-format=prometheus"
          - "-sinks=prometheus"
          - "-prom_listen=:8082"
        description:
          - >-
            Default arguments appended after the container image. The upstream
            ktranslate image uses the ktranslate binary as its entrypoint.
          - >-
            An instance command replaces this list completely, allowing any
            ktranslate-supported format, sink, input mode, or other CLI option.

      anro_ktranslate_instance_defaults:
        type: dict
        description:
          - >-
            Base instance values merged before optional type-profile and per-instance values.
            Override only keys that should apply to every container.
          - >-
            Merge precedence is instance defaults, optional same-named type profile,
            then the explicit instance. Lists are replaced rather than appended.

      anro_ktranslate_profiles:
        type: dict
        description:
          - Defines independent reusable instance defaults keyed by instance type.
          - Built-in profiles are polling, discovery, and traps.
          - Profiles do not inherit from other profiles.
          - A non-empty instance type selects the same-named profile; omitted, null, or empty type values skip profiles.
          - Mappings recursively merge; explicit scalar and list values replace inherited values.
          - ktranslate_args is merged by argument name so instances override only the CLI options they need.

      anro_ktranslate_reconcile:
        type: bool
        default: true
        description:
          - >-
            Stop and remove role-managed services and artifacts whose names are
            no longer present in anro_ktranslate_instances.

      anro_ktranslate_instances:
        type: list
        elements: dict
        default: []
        description:
          - Desired set of independent ktranslate containers.
          - >-
            The name is the exact systemd unit and Docker container basename.
            Type is optional; a non-empty type selects the same-named profile.
        options:
          name:
            type: str
            required: true
            description:
              - Exact Docker container and systemd service basename.
              - Must begin with anro_ktranslate_service_prefix followed by a dash.

          type:
            type: raw
            description:
              - Optional configuration type selecting the same-named key from anro_ktranslate_profiles.
              - Non-null values must be strings; validation rejects other data types.
              - Omitted, null, or empty values apply no profile defaults.
              - A non-empty type that is not defined in anro_ktranslate_profiles fails validation.

          ktranslate_args:
            type: dict
            description:
              - >-
                Keyed ktranslate CLI arguments. Type-profile and instance mappings are
                recursively merged and rendered as -key=value arguments.
              - >-
                Instance values override same-named type-profile values. Set a value
                to null to remove an argument inherited from the selected type profile.
              - Values must be strings, numbers, booleans, or null.
              - Mutually exclusive with command after defaults/type-profile normalization.
              - A null value removes the same-named argument inherited from the selected type profile.

          enabled:
            type: bool
            default: true
            description:
              - Whether the systemd service is enabled and running.

          image:
            type: str
            description:
              - Per-instance Docker image override.

          network:
            type: str
            description:
              - Per-instance Docker network mode override.
              - Host-network instances must not define ports.

          pull_policy:
            type: str
            choices:
              - always
              - missing
              - never
            description:
              - Per-instance Docker image pull policy override.

          restart_sec:
            type: int
            description:
              - Per-instance systemd restart delay in seconds.

          stop_timeout:
            type: int
            description:
              - Per-instance Docker stop timeout in seconds.

          start_limit_interval_sec:
            type: int
            description:
              - Per-instance systemd start-rate-limit interval in seconds.

          start_limit_burst:
            type: int
            description:
              - Per-instance allowed starts within the start-limit interval.

          environment:
            type: dict
            default: {}
            description:
              - Environment variables written to a root-only Docker env file.
              - Prefer this surface for credentials when ktranslate supports it.

          ports:
            type: list
            elements: str
            default: []
            description:
              - Docker publish specifications such as 127.0.0.1:18082:8082/tcp.
              - Must be empty when network is host.

          discovery_output:
            type: bool
            default: false
            description:
              - >-
                Create and bind-mount a dedicated runtime directory writable so
                ktranslate can safely replace and update snmp_out_file.
              - >-
                The built-in discovery profile enables this and writes raw
                inventory to /etc/ktranslate/runtime/discovery.yaml. The role does not
                promote that file into polling configuration.

          runtime_output:
            type: bool
            default: false
            description:
              - >-
                Create and bind-mount /etc/ktranslate/runtime as a dedicated
                writable per-instance directory for application-generated output.
              - >-
                The built-in traps profile enables this for its file sink.

          device_source:
            type: dict
            description:
              - >-
                Optional remote YAML device inventory merged with Ansible-owned
                SNMP configuration and rendered as one ktranslate SNMP file.
              - >-
                The remote document must contain only a top-level devices mapping
                for this feature; global collector policy remains in config.
              - >-
                Download and YAML validation complete before the active file is
                changed, so failures do not trigger restart or signal processing.
            options:
              url:
                type: str
                required: true
                description:
                  - HTTP or HTTPS URL returning the YAML device inventory.
              validate_certs:
                type: bool
                default: true
                description:
                  - Validate TLS certificates for HTTPS downloads.
              config:
                type: dict
                default: {}
                description:
                  - Ansible-owned ktranslate SNMP configuration merged with remote devices.
              name:
                type: str
                default: snmp.yaml
                description:
                  - Host filename for the assembled configuration.
              destination:
                type: path
                default: /etc/ktranslate/snmp.yaml
                description:
                  - Container path for the assembled configuration.
              mode:
                type: str
                default: "0640"
                description:
                  - Host mode for the assembled configuration.
              read_only:
                type: bool
                default: true
                description:
                  - Mount the assembled file read-only in the container.
              no_log:
                type: bool
                default: false
                description:
                  - Hide downloaded and assembled device data from task output.
              reload:
                type: str
                default: signal
                choices:
                  - restart
                  - signal
                description:
                  - Lifecycle action when the assembled file changes.
              reload_signal:
                type: str
                default: USR2
                description:
                  - Signal used when reload is signal.

          files:
            type: list
            elements: dict
            default: []
            description:
              - Files mounted individually into the container.
              - >-
                Managed files are rendered by this role from static inventory
                content; URL files are downloaded by the managed host; external
                files are owned by another process or role.
            options:
              name:
                type: str
                required: true
                description:
                  - Unique filename used under the instance host directory.

              source:
                type: str
                default: managed
                choices:
                  - managed
                  - external
                  - url
                description:
                  - Select managed content, an existing external host file, or an HTTP/HTTPS download.

              host_path:
                type: path
                description:
                  - Required absolute host path when source is external.
                  - Not valid when source is managed or url.

              url:
                type: str
                description:
                  - Required HTTP or HTTPS URL when source is url.
                  - The managed host stages the file before service reconciliation.
                  - A failed URL download prevents promotion, restart, and signal reload processing.

              validate_certs:
                type: bool
                default: true
                description:
                  - Validate TLS certificates for HTTPS URL downloads.

              destination:
                type: path
                required: true
                description:
                  - Absolute file path inside the container.

              format:
                type: str
                default: raw
                choices:
                  - raw
                  - yaml
                  - json
                description:
                  - Serialization applied to managed content.
                  - Raw requires string content; YAML/JSON accept mappings or lists.

              content:
                type: raw
                description:
                  - Static content for a managed file.
                  - Must not be supplied for an external or URL file.

              mode:
                type: str
                default: "0640"
                description:
                  - Host mode for a managed or downloaded URL file.

              read_only:
                type: bool
                default: true
                description:
                  - Mount the file read-only inside the container.

              no_log:
                type: bool
                default: false
                description:
                  - Hide managed file content from Ansible task output when sensitive.

              reload:
                type: str
                default: restart
                choices:
                  - restart
                  - signal
                description:
                  - >-
                    Lifecycle action when this file changes. restart recreates
                    the container; signal keeps the running container and sends
                    reload_signal after service reconciliation.
                  - >-
                    For external signal files, the role persists a private
                    checksum so changes are detected on later Ansible runs.

              reload_signal:
                type: str
                default: USR2
                description:
                  - >-
                    Signal sent when reload is signal. USR2 is the ktranslate
                    SNMP device-file reload signal.

          volumes:
            type: list
            elements: dict
            default: []
            description:
              - Additional generic bind mounts, typically for directories.
            options:
              source:
                type: path
                required: true
                description:
                  - Absolute host source path.
              target:
                type: path
                required: true
                description:
                  - Absolute container target path.
              read_only:
                type: bool
                default: false
                description:
                  - Mount the volume read-only.

          cap_add:
            type: list
            elements: str
            default: []
            description:
              - Linux capabilities passed to Docker with --cap-add.

          command:
            type: list
            elements: str
            description:
              - >-
                Raw arguments appended after the image. This is the escape hatch
                for configurations that should bypass keyed ktranslate_args rendering.
              - >-
                Mutually exclusive with ktranslate_args. When neither command nor
                ktranslate_args is present after normalization, the role uses
                anro_ktranslate_default_command.

          extra_docker_args:
            type: list
            elements: str
            default: []
            description:
              - Escape hatch for Docker run options not modeled by the role.
              - Do not place credentials here because unit files are readable.
