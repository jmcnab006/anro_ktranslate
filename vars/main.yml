---
# Marker embedded in generated units and used to identify role-managed units
# during reconciliation.
anro_ktranslate_managed_marker: "Managed by Ansible role anro_ktranslate"

_anro_ktranslate_snmp_config_defaults:
  global:
    poll_time_sec: 60
    timeout_ms: 3000
    retries: 1
    drop_if_outside_poll: false
    mib_profile_dir: /etc/ktranslate/profiles
    mibs_db: /etc/ktranslate/mibs.db
    mibs_enabled:
      - HOST-RESOURCES-MIB
  trap:
    listen: "0.0.0.0:1620"
  discovery:
    cidrs: []
    ports:
      - 161
    default_communities:
      - public
    add_devices: false
    add_mibs: true
    threads: 4

# create our hidden variable.
_anro_ktranslate_snmp_config: "{{ _anro_ktranslate_snmp_config_defaults | combine(anro_ktranslate_snmp_config) }}"


# I'm not using this yet but keeping here for reference this is generated via `ktranslate --generate-config`
